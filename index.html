<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살피 SALPI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ed; --paper: #ffffff;
    --hair: #ddd9cf; --hair2: #c9c5b8;
    --ink: #201f1b; --sub: #6b6a62; --faint: #a3a196;
    --green: #1e6b4e; --green-bg: #e6eee9;
    --amber: #96690f; --amber-bg: #f1e9d3;
    --red: #b3392b; --red-bg: #f3e3df;
    --mono: "IBM Plex Mono", monospace;
    --sans: "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 13.5px; line-height: 1.65; word-break: keep-all; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  ::selection { background: var(--green-bg); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

  /* ── 상단 ── */
  header.top { border-bottom: 2px solid var(--ink); }
  header.top .in { display: flex; align-items: baseline; gap: 36px; padding: 22px 0 0; flex-wrap: wrap; }
  h1.brand { font-size: 23px; font-weight: 800; letter-spacing: -0.03em; padding-bottom: 16px; }
  h1.brand small { font-family: var(--mono); font-size: 9px; font-weight: 400; color: var(--faint); letter-spacing: .3em; margin-left: 10px; }
  #tabs { display: flex; gap: 26px; flex-wrap: wrap; }
  .nav-it {
    font-size: 14px; font-weight: 600; color: var(--sub); border: 0; background: none;
    padding: 0 2px 16px; cursor: pointer; display: flex; align-items: center; gap: 7px;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: color .15s ease;
  }
  .nav-it:hover { color: var(--ink); }
  .nav-it.on { color: var(--ink); border-bottom-color: var(--ink); }
  .nav-it .cnt { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--red); }
  .who { margin-left: auto; font-size: 12px; color: var(--faint); display: flex; gap: 18px; padding-bottom: 16px; }
  .who a { color: var(--sub); text-decoration: none; border-bottom: 1px solid var(--hair2); padding-bottom: 1px; }
  .who a:hover { color: var(--ink); border-color: var(--ink); }

  /* ── 지표: 상자 없이 괘선 분할 ── */
  .stats { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--hair2); }
  .stat { padding: 20px 34px 18px 0; margin-right: 34px; border-right: 1px solid var(--hair); }
  .stat:last-child { border-right: none; }
  .stat b { display: block; font-size: 40px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat span.l { display: block; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .stat .d { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--faint); margin-top: 2px; display: block; }
  .stat.bad b, .stat.bad .d { color: var(--red); }
  .stat.warn .d { color: var(--amber); }
  .stat.ok .d { color: var(--green); }

  .view { animation: fade .25s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  main { padding-bottom: 56px; }

  /* 페이지 머리 */
  .pagehead { padding: 30px 0 22px; display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .pagehead .tx { max-width: 80ch; }
  .no { font-family: var(--mono); font-size: 10px; color: var(--sub); letter-spacing: .22em; display: block; margin-bottom: 8px; }
  h2.q { font-size: 30px; font-weight: 800; letter-spacing: -0.035em; margin-bottom: 8px; line-height: 1.25; }
  .qsub { font-size: 13px; color: var(--sub); line-height: 1.75; }
  .qsub b { color: var(--ink); font-weight: 600; }
  .pagehead .actions { margin-left: auto; display: flex; gap: 8px; padding-bottom: 4px; }
  .hint { font-size: 12.5px; color: var(--amber); margin-top: 14px; }

  /* ── 버튼 ── */
  button.act {
    font-size: 13px; font-weight: 700; padding: 9px 20px; border-radius: 4px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer;
    transition: opacity .15s ease;
  }
  button.act:hover { opacity: .82; }
  button.ghost2 { background: transparent; color: var(--ink); border-color: var(--hair2); }
  button.ghost2:hover { opacity: 1; border-color: var(--ink); }
  button.small { font-size: 11.5px; padding: 5px 13px; }
  button.danger { background: var(--red); border-color: var(--red); color: #fff; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:focus-visible, .nav-it:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  textarea, select {
    font-family: var(--mono); font-size: 12px; line-height: 1.7; color: var(--ink);
    border: 1px solid var(--hair2); border-radius: 4px; padding: 12px 14px; background: var(--paper);
  }
  textarea { width: 100%; resize: vertical; }
  textarea:focus, select:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  select { font-family: var(--sans); font-size: 12.5px; padding: 7px 12px; }

  /* ── 지도 ── */
  .mapgrid { display: grid; grid-template-columns: 1fr 300px; gap: 48px; }
  .maphead { display: flex; align-items: baseline; border-top: 2px solid var(--ink); padding: 12px 2px 4px; }
  .maphead .t { font-weight: 700; font-size: 14px; }
  .maphead .r { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: .08em; }
  svg.map { display: block; width: 100%; }
  svg.map text { font-family: var(--sans); }
  .zone { fill: var(--paper); stroke: var(--hair2); stroke-width: 1; }
  .zone.core { fill: var(--green-bg); stroke: var(--green); stroke-width: 1.4; }
  .zone.rogue-z { fill: var(--red-bg); stroke: var(--red); }
  .zlabel { font-size: 10.5px; font-weight: 700; fill: var(--ink); }
  .zlabel.rogue { fill: var(--red); }
  .item { font-size: 10px; fill: var(--sub); }
  .conduit { stroke: #b5b1a3; stroke-width: 1.4; cursor: pointer; transition: stroke .15s ease, stroke-width .15s ease; }
  .conduit:hover, .conduit.sel { stroke: var(--ink); stroke-width: 2.3; }
  .conduit.rogue { stroke: var(--red); stroke-width: 1.7; stroke-dasharray: 5 4; }
  .cond-label { font-family: var(--mono); font-size: 8.5px; fill: var(--faint); cursor: pointer; }
  .cond-label:hover { fill: var(--ink); }
  .cond-label.rogue { fill: var(--red); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) {
    .conduit.rogue { animation: crawl 1.6s linear infinite; }
    @keyframes crawl { to { stroke-dashoffset: -18; } }
  }
  .maplegend { display: flex; gap: 30px; font-size: 12px; color: var(--sub); padding: 10px 2px 0; border-top: 1px solid var(--hair); }
  .maplegend i { display: inline-block; width: 22px; height: 0; border-top: 1.4px solid #b5b1a3; vertical-align: 4px; margin-right: 8px; }
  .maplegend .r i { border-top: 1.7px dashed var(--red); }

  /* 우측: 상자 없는 목록 */
  .side h3 { font-size: 13px; font-weight: 700; border-top: 2px solid var(--ink); padding: 12px 0 8px; }
  .side section + section { margin-top: 26px; }
  .duty { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; color: var(--sub); padding: 8px 0; border-top: 1px solid var(--hair); }
  .duty:first-of-type { border-top: none; }
  .duty b { color: var(--ink); font-weight: 600; }
  .duty .when { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--amber); white-space: nowrap; }
  .rg { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-top: 1px solid var(--hair); font-size: 12.5px; }
  .rg:first-of-type { border-top: none; }
  .rg .host { font-family: var(--mono); font-size: 11.5px; color: var(--red); font-weight: 500; }
  .rg .sp { margin-left: auto; display: flex; gap: 5px; }
  .side .none { font-size: 12px; color: var(--faint); padding: 6px 0; }

  /* 상세: 괘선 블록 */
  .detail { margin-top: 30px; border-top: 2px solid var(--ink); padding-top: 16px; display: none; }
  .detail.rogue { border-top-color: var(--red); }
  .detail h3 { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
  .detail h3 .muted { font-weight: 500; color: var(--faint); font-size: 12px; margin-left: 8px; }
  .detail h3 .badge { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--red); margin-left: 10px; }
  .detail .grid { display: grid; grid-template-columns: 110px 1fr; gap: 4px 18px; font-size: 12.5px; max-width: 760px; }
  .detail .grid dt { color: var(--faint); }
  .detail .grid dd { color: var(--ink); }
  .ai-note { margin-top: 12px; padding: 10px 14px; background: var(--red-bg); font-size: 12px; line-height: 1.65; color: #7c2d22; max-width: 736px; }
  .ai-note .lbl { font-family: var(--mono); font-size: 9px; color: var(--red); display: block; margin-bottom: 3px; letter-spacing: .1em; }
  .content-log { margin-top: 12px; padding: 10px 14px; background: var(--green-bg); font-size: 12px; color: #17513c; max-width: 736px; }

  /* ── 장부: 표 ── */
  table.ledger, table.res { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.ledger th, table.res th {
    border-top: 2px solid var(--ink); border-bottom: 1px solid var(--hair2);
    text-align: left; padding: 10px 12px 8px; font-weight: 700; font-size: 11.5px; color: var(--ink);
  }
  table.ledger td, table.res td { border-bottom: 1px solid var(--hair); padding: 11px 12px; vertical-align: top; }
  tr.row-rogue td { background: var(--red-bg); }
  tr.row-blocked { opacity: .5; }
  .st { font-family: var(--mono); font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .st.ok { color: var(--green); } .st.rogue { color: var(--red); } .st.blocked { color: var(--faint); }
  .aiwhy { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
  .mono { font-family: var(--mono); font-size: 11.5px; }
  td .nm { font-weight: 700; }
  td .idcode { font-family: var(--mono); font-size: 10px; color: var(--faint); display: block; }
  .due-soon { color: var(--amber); font-weight: 700; }
  .cnt-has { color: var(--green); font-weight: 700; }

  /* ── 내용 검사 ── */
  .det-mode { display: flex; gap: 14px; align-items: center; font-size: 12px; flex-wrap: wrap; color: var(--sub); }
  .det-mode label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .det-mode input { accent-color: var(--green); }
  .det-mode .ok-dot { font-family: var(--mono); font-size: 10px; color: var(--green); }
  .det-mode .off-dot { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .det-out { margin-top: 16px; border-top: 2px solid var(--ink); }
  .det-hit { display: flex; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--hair); font-size: 12.5px; align-items: baseline; }
  .det-hit .tag { font-family: var(--mono); font-size: 9.5px; white-space: nowrap; font-weight: 600; }
  .det-hit.viol .tag { color: var(--red); } .det-hit.warn .tag { color: var(--amber); } .det-hit.info .tag { color: var(--faint); }
  .det-hit .span { font-family: var(--mono); font-size: 11.5px; background: var(--paper); border: 1px solid var(--hair); padding: 1px 7px; }
  .det-hit .note { font-size: 11.5px; color: var(--sub); }
  .det-empty { color: var(--faint); font-size: 12px; padding: 10px 4px; }

  /* ── 위저드 ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(32,31,27,.5);
    display: none; align-items: flex-start; justify-content: center;
    padding: 48px 16px; overflow-y: auto; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--paper); border: 1px solid var(--hair2);
    max-width: 700px; width: 100%; padding: 28px 32px 26px;
    animation: fade .2s ease both;

  .modal h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; }
  .modal .wsub { font-size: 11.5px; color: var(--faint); margin-bottom: 18px; }
  .modal .wsub a { color: var(--sub); }
  .wsteps { display: flex; gap: 6px; margin-bottom: 18px; }
  .wsteps .s { flex: 1; font-family: var(--mono); font-size: 9px; color: var(--faint); border-bottom: 2px solid var(--hair); padding-bottom: 6px; }
  .wsteps .s.on { color: var(--ink); border-color: var(--ink); font-weight: 600; }
  .opt { display: flex; gap: 12px; align-items: baseline; padding: 13px 4px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .opt:hover { background: var(--bg); }
  .opt .mark { flex: 0 0 13px; height: 13px; border: 1.5px solid var(--faint); border-radius: 50%; position: relative; top: 2px; }
  .opt.sel .mark { border-color: var(--ink); }
  .opt.sel .mark::after { content: ""; position: absolute; inset: 2.5px; background: var(--ink); border-radius: 50%; }
  .opt .t { font-weight: 700; font-size: 13px; }
  .opt .d { font-size: 11.5px; color: var(--sub); margin-top: 1px; }
  .evi { border-top: 1px solid var(--hair); padding: 13px 2px 11px; }
  .evi .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .evi .feat { font-weight: 800; font-size: 12.5px; }
  .avtag { font-family: var(--mono); font-size: 9.5px; }
  .avtag.builtin { color: var(--green); } .avtag.higher_tier { color: var(--amber); }
  .avtag.third_party { color: var(--sub); } .avtag.none { color: var(--red); } .avtag.unclear { color: var(--faint); }
  .evi .ctrl { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .applychk { display: flex; gap: 8px; align-items: flex-start; margin-top: 9px; font-size: 12px; cursor: pointer; }
  .applychk input { margin-top: 3px; accent-color: var(--green); }
  .wnav { display: flex; justify-content: space-between; margin-top: 20px; }
  .verdict-line { border-top: 2px solid var(--ink); padding-top: 15px; margin-top: 6px; }
  .verdict-line .word { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .verdict-line.ok .word { color: var(--green); } .verdict-line.cond .word { color: var(--amber); } .verdict-line.bad .word { color: var(--red); }
  .finding { display: flex; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--hair); font-size: 12px; }
  .finding .ic { font-family: var(--mono); font-weight: 600; }
  .finding.r .ic { color: var(--red); } .finding.w .ic { color: var(--amber); } .finding.g .ic { color: var(--green); }

  /* ── 반기 보고 ── */
  .report-page { background: var(--paper); border: 1px solid var(--hair2); padding: 34px 38px; max-width: 840px; color: #1c1e22; }
  .report-page h3 { border-bottom: 2px solid #1c1e22; padding-bottom: 6px; font-size: 16px; margin-bottom: 6px; }
  .report-page h4 { margin: 18px 0 6px; font-size: 13.5px; }
  .report-page p { font-size: 12px; }
  .report-page table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
  .report-page th { background: #f4f4f1; border: 1px solid #bbb; padding: 5px 8px; text-align: left; }
  .report-page td { border: 1px solid #bbb; padding: 5px 8px; }
  .report-page tr.flag td { background: var(--red-bg); }

  footer.legal { border-top: 1px solid var(--hair); padding: 20px 0 48px; font-size: 10.5px; color: var(--faint); line-height: 1.8; }

  @media (max-width: 980px) {
    .wrap { padding: 0 18px; }
    .mapgrid { grid-template-columns: 1fr; gap: 26px; }
    .who { display: none; }
    #tabs { gap: 16px; }
    .stat { padding-right: 20px; margin-right: 20px; }
    .stat b { font-size: 30px; }
    h2.q { font-size: 24px; }
  }
  @media print {
    body * { visibility: hidden; }
    .report-page, .report-page * { visibility: visible; }
    .report-page { position: absolute; left: 0; top: 0; border: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .view, .modal { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mask(s){
  return String(s)
    .replace(/\d[\d\s-]{4,}\d/g, run => {
      const total = (run.match(/\d/g)||[]).length; if (total < 5) return run;
      let seen = 0;
      return run.split('').reverse().map(ch => !/\d/.test(ch) ? ch : (++seen <= 4 ? ch : '*')).reverse().join('');
    })
    .replace(/([가-힣])[가-힣]([가-힣]?)(\s?(고객님|고객|님|씨))/g, '$1*$2$3');
}
function saasEntriesFor(key){
  if (!key) return [];
  const pack = (window.SALPI_EVIDENCE||[]).find(e => e.saas.toLowerCase().includes(key === 'm365' ? 'microsoft' : key));
  return pack ? pack.entries.map((e,i)=>({ ...e, _i:i })) : [];
}
function contentCount(id){ return (state.contentLog[id]||[]).length; }

/* ═══════════════ 로그 대조 (결정적) ═══════════════ */
function parseLog(text){
  const agg = {};
  for (const line of text.split('\n')) {
    const h = /HOST=(\S+)/.exec(line), s = /SRC=(\S+)/.exec(line), p = /DPT=(\S+)/.exec(line);
    if (!h) continue;
    const host = h[1].toLowerCase();
    agg[host] = agg[host] || { count:0, srcs:new Set(), ports:new Set() };
    agg[host].count++; if (s) agg[host].srcs.add(s[1]); if (p) agg[host].ports.add(p[1]);
  }
  return agg;
}
const matchLedger = host => LEDGER.find(c => c.domains.some(d => host === d || host.endsWith('.'+d)));
const isBlocked  = host => state.blocked.find(b => b.host === host);
function reconcile(text){
  const agg = parseLog(text);
  const rows = [], rogues = [];
  for (const [host, info] of Object.entries(agg)) {
    const hit = matchLedger(host);
    if (hit) { rows.push({ host, info, status:'ok', conduit:hit }); continue; }
    const blk = isBlocked(host);
    if (blk) { rows.push({ host, info, status:'blocked', blk }); continue; }
    const base = Object.keys(CLASSIFY).find(k => host === k || host.endsWith('.'+k));
    const cls = base ? CLASSIFY[base] : { kind:'미상 (LLM 분류 대상)', saasLike:false, risk:'대장의 어느 승인 콘딧에도 해당하지 않는 외부 연결' };
    const rogue = { host, info, cls };
    rows.push({ host, info, status:'rogue', rogue });
    rogues.push(rogue);
  }
  rows.sort((a,b) => (a.status==='rogue'?-1:1) - (b.status==='rogue'?-1:1) || b.info.count - a.info.count);
  return { rows, rogues };
}

function wizJudge(w){
  const risks = [], oks = [];
  if (w.nature === 'intent')
    return { grade:'bad', title:'예외 적용 불가', risks:[{lv:'r', t:'고객 정보를 다루는 것이 업무 목적 자체. 제1항 3호의 "처리하지 않는 이용 목적"에 해당하지 않음. 혁신금융서비스 경로 또는 차단.'}], oks };
  if (w.l1 === 'yes')
    return { grade:'bad', title:'예외 적용 불가', risks:[{lv:'r', t:'고객정보 필드형 기능 사용 계획. 구조화된 저장과 검색으로서 명백한 처리.'}], oks };
  const risky = ['combined','unique'].includes(w.nature);
  if (w.nature === 'unique') risks.push({lv:'w', t:'고유식별정보 유입 가능성. 입력 차단 통제 필수.'});
  const ctrl = w.entries.filter(e => (e.layer==='L2'||e.layer==='L3') && e.exists!=='no');
  if (!ctrl.length) {
    // 근거 미수집 SaaS. 실서비스는 E 파이프라인(LLM 문서 추출)이 수집
    if (risky) risks.push({lv:'r', t:'통제 근거 미수집 상태에서 고객 정보 유입 가능 용도. 등재 불가. 근거 수집(E 파이프라인) 후 재판정하거나 차단.'});
    else risks.push({lv:'w', t:'통제 근거 미수집. 조건부 등재하고 벤더 문서 근거 수집을 등재 조건으로 부기.'});
  }
  for (const e of ctrl) {
    const has = ['builtin','higher_tier','third_party'].includes(e.control_availability);
    const applied = w.applied[e._i], comp = w.comp[e._i];
    if (has && applied) oks.push({lv:'g', t:`${e.feature}: 적용 계획 확인`});
    else if (!has && comp) risks.push({lv:'w', t:`${e.feature}: 벤더 미제공. 살피 내용검사를 보완통제로 지정`});
    else if (risky) risks.push({lv:'r', t:`${e.feature}: 통제 미적용. 유입 가능 용도에서 접점 열림`});
    else risks.push({lv:'w', t:`${e.feature}: 통제 미적용 (권고)`});
  }
  const hard = risks.filter(r => r.lv==='r').length;
  if (hard) return { grade:'bad', title:'조건 미충족, 등재 불가', risks, oks };
  if (risks.length) return { grade:'cond', title:'조건부 적합, 등재 가능', risks, oks };
  return { grade:'ok', title:'예외 요건 충족, 등재 가능', risks, oks };
}

  if (w.step === 4) {
    const ctrl = w.entries.filter(e => (e.layer==='L2'||e.layer==='L3') && e.exists!=='no');
    body = ctrl.length ? ctrl.map(e => {
      const has = ['builtin','higher_tier','third_party'].includes(e.control_availability);
      const AV = {builtin:'[기본 제공]',higher_tier:'[상위 요금제]',third_party:'[서드파티]',none:'[미제공]',unclear:'[미확인]'};
      return `<div class="evi"><div class="head"><span class="feat">${esc(e.feature)}</span><span class="avtag ${e.control_availability}">${AV[e.control_availability]}</span></div>
        <div class="ctrl">${esc(e.control.slice(0,140))}${e.control.length>140?'…':''}</div>

    }).join('') + nav(true, '판정')
    : `<p style="font-size:12.5px;color:var(--sub)">이 SaaS의 통제 근거가 아직 없다. 실서비스에서는 여기서 E 파이프라인이 벤더 공개 문서를 읽어 근거 카드를 채운다(원문 인용 강제). 데모에서는 미수집 상태로 판정에 넘긴다.</p>` + nav(true, '판정');

    const v = wizJudge(w);
    w.verdict = v;
    body = `<div class="verdict-line ${v.grade==='ok'?'ok':v.grade==='cond'?'cond':'bad'}"><div class="word">${v.title}</div></div>
      <div style="margin:10px 0 4px">${v.risks.map(r=>`<div class="finding ${r.lv}"><span class="ic">${r.lv==='r'?'×':'!'}</span><span>${r.t}</span></div>`).join('')}

}

function quickBlock(host){
  const r = state.rogues.find(x => x.host === host); if (!r) return;

  state.sel = null; render();
}

/* ── 내용 검사 (살피 탐지 엔진) ── */
let detSeq = 0;
function renderContent(){
  const saas = LEDGER.filter(c => c.zone==='saas');
  $('#main').innerHTML = `<section class="view">
    <div class="pagehead">
      <div class="tx">

        탐지 기록은 해당 콘딧의 반기 자체평가 증적이 된다. 판정은 규칙과 검증이, 결합 판단은 로컬 LLM이 맡는다. 실측 F1 85.4.</p>
      </div>
    </div>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <span style="font-size:12.5px;color:var(--sub)">대상 콘딧</span>
      <select id="det-target">
        ${saas.map(c=>`<option value="${c.id}">${c.id} ${esc(c.name)}</option>`).join('')}
      </select>
      <span class="det-mode" id="det-mode"></span>
      <button class="act ghost2 small" id="det-sample" style="margin-left:auto">예시 회의록 넣기</button>
    </div>
    <textarea id="det-in" style="height:130px" placeholder="이 SaaS에 올리려는 문서나 회의록을 붙여넣으면 실시간으로 탐지한다"></textarea>
    <div id="det-out" class="det-out" style="display:none"></div>
    <div id="det-note"></div></section>`;
  $('#det-sample').onclick = () => {
    $('#det-in').value = `3월 여신협의회 회의록\n1. 박지현 고객 주택담보대출 연체 3개월 경과 건. 연락처 010-4821-7733.\n2. 신규 상품 한도 정책은 다음 회의에서 확정.\n3. 정해나 고객 재방문 상담 진행.\n   - 해당 고객은 신용대출 상환 지연 이력이 있음.\n4. 사내 워크숍 일정 공유.`;
    detRun();
  };
  $('#det-in').oninput = () => { clearTimeout(window._dt); window._dt = setTimeout(detRun, 500); };
  detProbe();
}
async function detProbe(){
  const el = $('#det-mode'); if (!el) return;
  const av = await SalpiEngine.llmAvailable();
  state.detReady = !!(av.ok && av.hasModel);
  el.innerHTML = state.detReady
    ? `<label><input type="radio" name="dm" value="heuristic" ${state.detMode==='heuristic'?'checked':''}> 규칙 근사</label>
       <label><input type="radio" name="dm" value="hybrid" ${state.detMode==='hybrid'?'checked':''}> 로컬 LLM</label><span class="ok-dot">모델 연결됨</span>`
    : `<span class="off-dot">로컬 모델 미연결, 규칙 근사로 동작</span>`;
  el.querySelectorAll('input[name="dm"]').forEach(r => r.onchange = () => { state.detMode = r.value; detRun(); });
}
async function detRun(){
  const ta = $('#det-in'), out = $('#det-out'), note = $('#det-note');
  if (!ta || !out) return;
  if (!ta.value.trim()) { out.innerHTML = ''; out.style.display = 'none'; note.innerHTML = ''; return; }
  const seq = ++detSeq;
  out.style.display = 'block';
  if (state.detMode !== 'heuristic') out.innerHTML = '<div class="det-empty">로컬 모델 판단 중…</div>';
  const res = await SalpiEngine.scan(ta.value, { mode: state.detMode });
  if (seq !== detSeq) return;
  const target = $('#det-target')?.value || 'C-05';
  const viols = res.hits.filter(h => h.severity==='violation');
  if (viols.length) {
    state.contentLog[target] = (state.contentLog[target]||[]).concat(
      viols.map(v => ({ t: Date.now(), tag: v.tag, masked: mask(v.span).slice(0,60) }))).slice(-100);
    renderStrip();
  }
  out.innerHTML = (res.degraded?`<div class="det-empty" style="color:var(--amber)">${esc(res.degraded)}</div>`:'') +
    (res.hits.length ? res.hits.map(h => {
      const lv = h.severity==='violation'?'viol':(h.label==='identifier_only'?'info':'warn');
      return `<div class="det-hit ${lv}"><span class="tag">[${esc(h.tag)}]</span><span class="span">${esc(h.span.slice(0,64))}</span><span class="note">${esc(h.note)}</span></div>`;
    }).join('') : '<div class="det-empty">탐지된 항목 없음</div>');
  note.innerHTML = viols.length ? `<div class="hint">위반 ${viols.length}건이 ${target} 콘딧의 내용검사 기록에 저장됐다(마스킹). 대장과 반기 보고에 반영된다.</div>` : '';
}

/* ── 반기 보고 ── */
function renderReport(){
  const saas = LEDGER.filter(c => c.review.type.includes('반기'));
  const byType = {};
  for (const c of LEDGER) byType[c.type] = (byType[c.type]||0)+1;
  const now = new Date();
  $('#main').innerHTML = `<section class="view">
    <div class="pagehead">
      <div class="tx">
        <span class="no">05 / REPORT</span>
        <h2 class="q">반기 보고</h2>
        <p class="qsub">정보보호위원회 제출 초안. 대장(통로 현황), 로그 대조(실측), 내용 검사(살피 증적)가 한 문서로 조립된다.</p>
      </div>
      <div class="actions"><button class="act" onclick="window.print()">인쇄 / PDF 저장</button></div>
    </div>
    <div class="report-page">
      <h3>망분리 적용 예외 운영 현황 및 반기 자체평가 보고 (초안)</h3>
      <p style="color:#555">기준일 ${now.toISOString().slice(0,10)}, 근거: 시행세칙 제2조의3 제3항과 제4항</p>
      <h4>1. 예외 운영 현황</h4>
      <table><tr><th>유형</th><th>건수</th></tr>
        ${Object.entries(byType).map(([t,n])=>`<tr><td>${t}</td><td>${n}</td></tr>`).join('')}
        <tr ${state.rogues.length?'class="flag"':''}><td><b>미등록 연결 (로그 실측)</b></td><td><b>${state.rogues.length}</b></td></tr>
        ${state.blocked.length?`<tr><td>차단 확정</td><td>${state.blocked.length}</td></tr>`:''}
      </table>
      <h4>2. SaaS 반기 자체평가 (제4항)와 내용검사 증적</h4>
      <table><tr><th>콘딧</th><th>적용 통제</th><th>내용검사 기록</th><th>기한</th></tr>
        ${saas.map(c=>`<tr><td>${c.id} ${esc(c.name)}</td><td style="font-size:11px">${esc(c.controls)}</td>
          <td>${contentCount(c.id)}건 (마스킹 저장)</td><td>${c.review.due}</td></tr>`).join('')}
      </table>
      <h4>3. 미등록 연결 발견과 조치</h4>
      ${state.rogues.length || state.blocked.length ? `<table><tr><th>목적지</th><th>분류</th><th>상태</th></tr>
        ${state.rogues.map(r=>`<tr><td>${esc(r.host)}</td><td>${r.cls.kind}</td><td>조치 대기 (등재 판정 또는 차단)</td></tr>`).join('')}
        ${state.blocked.map(b=>`<tr><td>${esc(b.host)}</td><td>${b.kind}</td><td>차단 확정</td></tr>`).join('')}</table>`
        : '<p>로그 대조를 먼저 실행하면 이 절이 채워진다.</p>'}
      <table style="margin-top:16px"><tr><th style="width:70%">확인</th><th>서명</th></tr>
        <tr><td>작성: 정보보호 담당</td><td></td></tr><tr><td>정보보호최고책임자(CISO)</td><td></td></tr></table>
      <p style="font-size:10.5px;color:#777;margin-top:12px">본 문서는 살피가 생성한 초안이며 위원회 심의와 확정 전 검토용이다.</p>
    </div></section>`;
}

function render(){
  renderStrip(); renderTabs();
  ({ map:renderMap, ledger:renderLedger, logs:renderLogs, content:renderContent, report:renderReport })[state.tab]();
}
render();
</script>
</body>
</html>
