<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살피 SALPI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 디자인 시스템 12곳 조사에서 종합한 30개 강점의 구현.
     그림자와 팔레트는 Stripe, 사이드바는 Atlassian, 표와 카운터는 GitHub Primer,
     KPI와 카드 문법은 shadcn, 모션은 Bezier와 Linear, 상태 레이어는 Material 3 */
  :root {
    /* 2. 네이비 스케일 (Stripe) */
    --bg: #f6f9fc; --panel: #ffffff;
    --ink: #0a2540; --body: #425466; --muted: #697386; --disabled: #8792a2;
    --line: #e3e8ee; --hover: #f7fafc; --hair: rgba(0,0,0,.08);
    --blue: #2157d1; --blue-hover: #1a47ad; --blue-bg: #eef3fd; --blue-soft: #e6eefb;
    --st-ok: #2da44e; --st-soon: #e8a23d; --st-over: #e5484d;
    /* 7. 파스텔 상태색 */
    --ok-bg: #d7f7c2; --ok-fg: #05690d;
    --warn-bg: #f8e5b9; --warn-fg: #983705;
    --bad-bg: #ffe0e0; --bad-fg: #a41c1c;
    --neutral-bg: #e3e8ee; --neutral-fg: #4f566b;
    /* 1, 10. 그림자 2종: 바닥 카드와 떠 있는 레이어 */
    --shadow-card: 0 0 0 1px rgba(50,50,93,.05), 0 2px 5px 0 rgba(50,50,93,.10), 0 1px 1px 0 rgba(0,0,0,.07);
    --shadow-overlay: 0 0 0 1px rgba(50,50,93,.05), 0 13px 27px -5px rgba(50,50,93,.25), 0 8px 16px -8px rgba(0,0,0,.30);
    /* 8. radius 스케일 */
    --radius: 10px; --r-modal: 12px; --r-ctl: 6px; --r-pop: 8px;
    /* 9. 모션 */
    --ease: cubic-bezier(.3,0,0,1); --t: 150ms var(--ease);
    /* 14. 스페이싱 */
    --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-24: 24px; --sp-32: 32px;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--body); font-family: var(--sans);
    font-size: 14px; line-height: 20px; word-break: keep-all; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  a { color: var(--blue); text-decoration: none; }
  ::selection { background: #d1e6ff; }

  /* ── 3. 상단바: #0a2540, 텍스트 3색 규율 ── */
  header.topbar { background: #0a2540; height: 52px; display: flex; align-items: center; padding: 0 32px; gap: 16px; position: sticky; top: 0; z-index: 40; }
  h1.brand { font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; letter-spacing: -0.1px; display: flex; align-items: center; }
  .mark { width: 20px; height: 20px; margin-right: 8px; flex: none; }
  .lb-logo .mark { width: 30px; height: 30px; margin-right: 10px; }
  h1.brand small { font-family: var(--mono); font-size: 8.5px; font-weight: 500; color: #adbdcc; letter-spacing: .26em; margin-left: 9px; }
  .topbar .divider { width: 1px; height: 20px; background: rgba(255,255,255,.1); }
  .topbar .svc { font-size: 14px; color: #adbdcc; font-weight: 500; }
  .who { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 13px; color: #adbdcc; }
  .who .org { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  .who .avatar {
    width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700;
  }
  /* 29. 아이콘 버튼 상태 레이어 (Material) */
  .who a { position: relative; color: #adbdcc; font-weight: 500; font-size: 13px; padding: 6px 10px; border-radius: var(--r-ctl); transition: color var(--t); }
  .who a::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; border-radius: inherit; transition: opacity var(--t); pointer-events: none; }
  .who a:hover { color: #fff; }
  .who a:hover::after { opacity: .08; }
  .who a:active::after { opacity: .12; }

  /* ── 레이아웃 ── */
  .layout { min-height: calc(100dvh - 96px); }

  /* ── 상단 탭 (사이드바 대신). 밑줄 탭, 한 줄 ── */
  .subnav { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 52px; z-index: 30; }
  .subnav-in { max-width: 1440px; margin: 0 auto; padding: 0 32px; display: flex; align-items: stretch; gap: 4px; height: 44px; }
  #tabs { display: flex; gap: 4px; }
  .nav-it {
    display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px;
    border: 0; border-bottom: 2px solid transparent; background: none; margin-bottom: -1px;
    color: var(--muted); font-size: 13.5px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: color var(--t), border-color var(--t);
  }
  .nav-it svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .nav-it:hover { color: var(--ink); }
  .nav-it.on { color: var(--ink); border-bottom-color: var(--ink); }
  .nav-it.tool { margin-left: 8px; padding-left: 16px; border-left: 1px solid var(--line); }
  .ai-state { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .ai-state .side-status-sub { padding: 0; }
  /* 27. 반투명 카운터 (Primer) */
  .nav-it .cnt {
    margin-left: auto; display: inline-block; min-width: 20px; padding: 0 6px;
    font-size: 12px; font-weight: 500; line-height: 18px; text-align: center;
    color: inherit; background: rgba(175,184,193,.25); border-radius: 2em;
  }
  .nav-it.has-alert { color: var(--bad-fg); }
  .content { min-width: 0; padding: 24px 32px 56px; max-width: 1440px; margin: 0 auto; }

  /* ── 22. 브레드크럼 + 미디엄 타이틀 ── */
  .crumb { font-size: 13px; line-height: 18px; color: var(--muted); margin-bottom: 10px; }
  .crumb a { color: inherit; cursor: pointer; transition: color var(--t); }
  .crumb a:hover { color: var(--blue); }
  .crumb .sep { margin: 0 8px; }
  .pagehead { display: flex; align-items: flex-start; gap: var(--sp-24); flex-wrap: wrap; margin-bottom: var(--sp-24); }
  .pagehead .tx { max-width: 88ch; }
  h2.q { font: 600 20px/28px var(--sans); color: var(--ink); letter-spacing: -0.4px; margin-bottom: 4px; }
  .qsub { font-size: 14px; line-height: 20px; color: var(--muted); }
  .pagehead .actions { margin-left: auto; display: flex; gap: var(--sp-8); padding-top: 2px; }

  /* ── 28. 파스텔 안내 배너 (Primer flash) ── */
  .hint {
    font-size: 14px; line-height: 20px; color: var(--ink); margin-top: var(--sp-16); padding: 12px 16px;
    background: #dbedff; border: 1px solid rgba(84,174,255,.4); border-radius: var(--r-pop);
  }

  /* ── 1. 카드: 남색 틴트 레이어드 그림자, 보더 없음 ── */
  .panel { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow-card); }
  /* 13. 카드 헤더 문법 (shadcn) */
  .panel-hd { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; flex-wrap: wrap; }
  .panel-hd .t { font: 600 16px/24px var(--sans); color: var(--ink); letter-spacing: -0.1px; }
  .panel-hd .count { font-size: 14px; color: var(--muted); font-weight: 500; }
  .panel-hd .r { margin-left: auto; display: flex; gap: var(--sp-8); align-items: center; font-size: 13px; color: var(--muted); }
  .panel-hd.rule { border-bottom: 1px solid var(--line); }
  .panel-bd { padding: 16px 20px; }

  /* ── 6. KPI 스탯 카드 (shadcn) ── */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin-bottom: var(--sp-16); padding: 6px 8px; }
  .stat { padding: 12px 18px 10px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: 0; }
  .stat .l { display: block; font-size: 12.5px; line-height: 18px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; }
  .stat b { display: block; font: 600 28px/34px var(--sans); color: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat.bad b { color: var(--bad-fg); } .stat.warn b { color: var(--warn-fg); } .stat.ok b { color: var(--ok-fg); }

  .view { animation: fade 150ms var(--ease) both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ── 11. 고정 높이 버튼 (Geist + Primer) ── */
  button.act {
    height: 32px; padding: 0 12px; font-size: 14px; font-weight: 500; border-radius: var(--r-ctl);
    border: 0; background: var(--blue); color: #fff; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background-color var(--t), color var(--t), border-color var(--t), box-shadow var(--t);
  }
  button.act:hover { background: var(--blue-hover); }
  button.ghost2 {
    background: var(--panel); color: var(--ink);
    border: 1px solid rgba(31,35,40,.15); box-shadow: 0 1px 0 rgba(31,35,40,.04);
  }
  button.ghost2:hover { background: var(--hover); }
  button.small { height: 26px; font-size: 13px; padding: 0 10px; }
  button.danger { background: var(--panel); border: 1px solid rgba(31,35,40,.15); box-shadow: 0 1px 0 rgba(31,35,40,.04); color: var(--bad-fg); }
  button.danger:hover { background: #fff5f5; border-color: rgba(164,28,28,.35); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  /* 12. focus-visible 전용 포커스 링 */
  :focus { outline: none; }
  button:focus-visible, .nav-it:focus-visible, a:focus-visible { box-shadow: 0 0 0 4px rgba(33,87,209,.25); }
  .topbar :focus-visible { box-shadow: 0 0 0 2px #0a2540, 0 0 0 4px #4ba1f0; }

  textarea, select {
    font-family: var(--mono); font-size: 13px; line-height: 18px; color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 10px 12px; background: var(--panel);
    transition: border-color var(--t), box-shadow var(--t);
  }
  textarea { width: 100%; resize: vertical; }
  textarea:focus, select:focus { border-color: var(--blue); box-shadow: 0 1px 1px rgba(0,0,0,.07), 0 0 0 4px rgba(33,87,209,.25); }
  select { font-family: var(--sans); font-size: 14px; height: 32px; padding: 0 10px; }

  /* ── 7. 파스텔 상태 배지 (Stripe) ── */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 500; line-height: 16px; padding: 1px 6px;
    border-radius: 4px; white-space: nowrap;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .badge.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .badge.gray { background: var(--neutral-bg); color: var(--neutral-fg); }

  /* 26. 상태 점 (Geist) */
  .status-dot { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .status-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #45a557; }
  .status-dot.off::before { background: #8792a2; }

  /* ── 지도: 18. 파랑은 선택 전용 ── */

  .subgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-16); margin-top: var(--sp-16); }
  .rowitem { display: flex; gap: var(--sp-12); align-items: center; font-size: 14px; color: var(--body); padding: 10px 20px; border-top: 1px solid var(--line); }
  .rowitem:first-of-type { border-top: none; }
  .rowitem b { color: var(--ink); font-weight: 600; }
  .rowitem .when { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--warn-fg); font-weight: 600; white-space: nowrap; }
  .rowitem .host { font-family: var(--mono); font-size: 13px; color: var(--bad-fg); font-weight: 600; }
  .rowitem .sp { margin-left: auto; display: flex; gap: 6px; }
  .none { font-size: 14px; color: var(--disabled); padding: 12px 20px; }

  /* 상세 */
  .detail { margin-top: var(--sp-16); display: none; }
  .detail .grid { display: grid; grid-template-columns: 120px 1fr; gap: 6px 20px; font-size: 14px; max-width: 860px; }
  .detail .grid dt { color: var(--muted); }
  .detail .grid dd { color: var(--ink); }
  .ai-note { margin-top: var(--sp-12); padding: 12px 16px; background: #ffebe9; border: 1px solid rgba(255,129,130,.4); border-radius: var(--r-pop); font-size: 14px; line-height: 20px; color: var(--ink); max-width: 828px; }
  .ai-note .lbl { font-weight: 600; color: var(--bad-fg); display: block; margin-bottom: 2px; }
  .content-log { margin-top: var(--sp-12); padding: 12px 16px; background: #dafbe1; border: 1px solid rgba(74,194,107,.4); border-radius: var(--r-pop); font-size: 14px; color: var(--ink); max-width: 828px; }

  /* ── 5. 표: 가로선 전용, th 12/500 (Stripe) ── */
  table.ledger, table.res { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.ledger th, table.res th {
    font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted);
    text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  table.ledger td, table.res td { padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--body); vertical-align: top; }
  table.ledger tr:last-child td, table.res tr:last-child td { border-bottom: none; }
  table.ledger tbody tr td, table.res tbody tr td { transition: background-color var(--t); }
  table.ledger tbody tr:hover td, table.res tbody tr:hover td { background: var(--hover); }
  tr.row-rogue td { background: #fffafa; }
  tr.row-blocked { opacity: .5; }
  .aiwhy { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 3px; max-width: 52ch; }
  /* 16. 기계값 전용 모노 (Geist) */
  .mono { font-family: var(--mono); font-size: 13px; }
  td .idcode, .badge-id { font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--hover); border: 1px solid var(--hair); border-radius: 4px; padding: 1px 6px; display: inline-block; margin-top: 3px; }
  td .nm { font-weight: 600; color: var(--ink); }
  .due-soon { color: var(--warn-fg); font-weight: 600; }
  .cnt-has { color: var(--ok-fg); font-weight: 600; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ── 내용 검사 ── */
  .det-mode { display: flex; gap: var(--sp-16); align-items: center; font-size: 14px; flex-wrap: wrap; color: var(--body); }
  .det-mode label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .det-mode input { accent-color: var(--blue); width: 15px; height: 15px; }
  .det-hit { display: flex; gap: var(--sp-12); padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
  .det-hit:last-of-type { border-bottom: none; }
  .det-hit .tag { font-family: var(--mono); font-size: 11px; white-space: nowrap; font-weight: 600; }
  .det-hit.viol .tag { color: var(--bad-fg); } .det-hit.warn .tag { color: var(--warn-fg); } .det-hit.info .tag { color: var(--disabled); }
  .det-hit .span { font-family: var(--mono); font-size: 12.5px; background: var(--hover); border: 1px solid var(--hair); border-radius: 4px; padding: 1px 7px; }
  .det-hit .note { font-size: 13px; color: var(--muted); }
  .det-empty { color: var(--disabled); font-size: 14px; padding: 12px 20px; }

  /* AI 판정 실황 */
  .ai-bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 20px 4px; }
  .ai-bar i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 2px; transition: width 300ms var(--ease); }
  .ai-row { display: flex; gap: var(--sp-12); padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 13px; align-items: baseline; animation: fade 150ms var(--ease) both; }
  .ai-row:last-of-type { border-bottom: none; }
  .ai-row .no { font-family: var(--mono); font-size: 11px; color: var(--disabled); flex: 0 0 38px; }
  .ai-row .chunk { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ai-row .out { flex: 0 0 auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .ai-row .ms { font-family: var(--mono); font-size: 11px; color: var(--disabled); flex: 0 0 48px; text-align: right; }
  .ai-row.pending .chunk { color: var(--ink); }
  .ai-row.pending .out::after { content: "판정 중"; font-size: 13px; color: var(--blue); font-weight: 600; animation: blink 1s var(--ease) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* ── 10, 20. 모달: 승격 그림자와 자리잡는 등장 ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,37,64,.4);
    display: none; align-items: flex-start; justify-content: center;
    padding: 52px 16px; overflow-y: auto; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel); border-radius: var(--r-modal);
    max-width: 740px; width: 100%; padding: 24px 28px 26px;
    box-shadow: var(--shadow-overlay);
    animation: pop-in 200ms var(--ease) both;
  }
  @keyframes pop-in { from { opacity: 0; transform: scale(.98) translateY(-2px); } }
  .modal h3 { font: 600 18px/26px var(--sans); color: var(--ink); letter-spacing: -0.1px; margin-bottom: 2px; }
  .modal .wsub { font-size: 13px; line-height: 18px; color: var(--muted); margin-bottom: var(--sp-16); }
  .wsteps { display: flex; gap: 6px; margin-bottom: var(--sp-16); }
  .wsteps .s { flex: 1; font-size: 12px; line-height: 16px; color: var(--disabled); border-bottom: 2px solid var(--line); padding-bottom: 7px; transition: color var(--t), border-color var(--t); }
  .wsteps .s.on { color: var(--blue); border-color: var(--blue); font-weight: 600; }
  /* 24. 선택 행: 좌측 인셋 바 (Cloudscape) */
  .opt { display: flex; gap: var(--sp-12); align-items: baseline; padding: 12px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background-color var(--t), box-shadow var(--t); }
  .opt:hover { background: var(--hover); }
  .opt.sel { background: var(--blue-bg); box-shadow: inset 2px 0 0 var(--blue); border-bottom-color: transparent; }
  .opt .mark { flex: 0 0 15px; height: 15px; border: 1.5px solid var(--disabled); border-radius: 50%; position: relative; top: 2px; background: var(--panel); transition: border-color var(--t); }
  .opt.sel .mark { border-color: var(--blue); }
  .opt.sel .mark::after { content: ""; position: absolute; inset: 2.5px; background: var(--blue); border-radius: 50%; }
  .opt .t { font-weight: 600; font-size: 14px; color: var(--ink); }
  .opt .d { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 2px; }
  .evi { border-top: 1px solid var(--line); padding: 13px 4px 12px; }
  .evi .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .evi .feat { font-weight: 600; font-size: 14px; color: var(--ink); }
  .avtag { font-size: 12px; font-weight: 600; }
  .avtag.builtin { color: var(--ok-fg); } .avtag.higher_tier { color: var(--warn-fg); }
  .avtag.third_party { color: var(--muted); } .avtag.none { color: var(--bad-fg); } .avtag.unclear { color: var(--disabled); }
  .evi .ctrl { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 4px; }
  .applychk { display: flex; gap: 9px; align-items: flex-start; margin-top: 10px; font-size: 13px; cursor: pointer; color: var(--body); }
  .applychk input { margin-top: 3px; accent-color: var(--blue); width: 15px; height: 15px; }
  .wnav { display: flex; justify-content: space-between; margin-top: var(--sp-24); }
  .verdict-line { border-top: 1px solid var(--line); padding-top: var(--sp-16); margin-top: var(--sp-8); }
  .verdict-line .word { font: 600 20px/28px var(--sans); letter-spacing: -0.4px; }
  .verdict-line.ok .word { color: var(--ok-fg); } .verdict-line.cond .word { color: var(--warn-fg); } .verdict-line.bad .word { color: var(--bad-fg); }
  .finding { display: flex; gap: 11px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 18px; }
  .finding .ic { font-family: var(--mono); font-weight: 600; }
  .finding.r .ic { color: var(--bad-fg); } .finding.w .ic { color: var(--warn-fg); } .finding.g .ic { color: var(--ok-fg); }

  /* ── 반기 보고 ── */
  .report-page { padding: 32px 36px; max-width: 880px; color: #1c1e22; }
  .report-page h3 { border-bottom: 2px solid #1c1e22; padding-bottom: 7px; font-size: 17px; margin-bottom: 7px; }
  .report-page h4 { margin: 20px 0 7px; font-size: 14.5px; }
  .report-page p { font-size: 13px; }
  .report-page table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 9px 0; }
  .report-page th { background: #f4f4f1; border: 1px solid #bbb; padding: 6px 9px; text-align: left; }
  .report-page td { border: 1px solid #bbb; padding: 6px 9px; }
  .report-page tr.flag td { background: #ffebe9; }

  footer.legal { padding: var(--sp-32) 0 0; font-size: 12px; line-height: 18px; color: var(--disabled); }

  /* ── 로그인 ── */
  .login-screen {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 18% 22%, #e6eef9 0, transparent 42%), radial-gradient(circle at 84% 78%, #e3ebf5 0, transparent 38%), var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-screen::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(10,37,64,.085) 1px, transparent 1.2px); background-size: 22px 22px; }
  .login-split { position: relative; }
  .login-card {
    background: var(--panel); border-radius: var(--r-modal);
    padding: 40px 38px 30px; width: 392px; box-shadow: var(--shadow-card);
  }
  .login-card .logo { font: 700 26px/34px var(--sans); color: var(--ink); letter-spacing: -0.4px; }
  .login-card .logo small { font-family: var(--mono); font-size: 9.5px; color: var(--disabled); letter-spacing: .26em; margin-left: 10px; }
  .login-card .ld { font-size: 14px; color: var(--muted); margin: 4px 0 26px; }
  .login-card label { display: block; font-size: 13px; font-weight: 600; color: var(--body); margin: 16px 0 6px; }
  .login-card input {
    width: 100%; font-family: var(--sans); font-size: 14px; color: var(--ink); height: 34px;
    border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 0 12px; background: var(--panel);
    transition: border-color var(--t), box-shadow var(--t);
  }
  .login-card input:focus { border-color: var(--blue); box-shadow: 0 1px 1px rgba(0,0,0,.07), 0 0 0 4px rgba(33,87,209,.25); }
  .login-card button { width: 100%; margin-top: 26px; height: 36px; justify-content: center; font-size: 14px; font-weight: 600; }
  .login-card .demo-note { font-size: 12px; line-height: 18px; color: var(--disabled); margin-top: 16px; text-align: center; }

  /* ── 상단바 검색 ── */
  .tsearch { position: relative; margin-left: 8px; width: 340px; }
  .tsearch svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: #8aa2b8; fill: none; stroke-width: 1.8; stroke-linecap: round; pointer-events: none; }
  .tsearch input {
    width: 100%; height: 32px; padding: 0 12px 0 32px; font-family: var(--sans); font-size: 13px;
    color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: var(--r-ctl);
    transition: background-color var(--t), border-color var(--t);
  }
  .tsearch input::placeholder { color: #8aa2b8; }
  .tsearch input:focus { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); box-shadow: none; }
  .tsearch-drop {
    display: none; position: absolute; top: 38px; left: 0; right: 0; z-index: 60;
    background: var(--panel); border-radius: var(--r-pop); box-shadow: var(--shadow-overlay);
    padding: 6px; max-height: 320px; overflow: auto;
    animation: pop-in 150ms var(--ease) both; transform-origin: top;
  }
  .tsearch-drop.open { display: block; }
  .tsearch-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-ctl); cursor: pointer; font-size: 14px; color: var(--ink); transition: background-color var(--t); }
  .tsearch-item:hover { background: var(--hover); }
  .tsearch-item .ti-id { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: 0 0 40px; }
  .tsearch-item .ti-host { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .tsearch-empty { padding: 10px 12px; font-size: 13px; color: var(--disabled); }

  .side-status-sub { font-family: var(--mono); font-size: 11px; color: var(--disabled); }

  /* ── KPI 미니 시각화 ── */
  .stat { display: flex; align-items: center; gap: 12px; }
  .stat .tx { min-width: 0; }
  .stat .viz { margin-left: auto; flex-shrink: 0; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
  .spark i { width: 7px; border-radius: 2px 2px 0 0; background: #f3c7c7; }
  .spark i.now { background: #e5484d; }
  .spark.calm i { background: var(--line); }

  /* ── 대장 이니셜 칩 ── */
  .org-chip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: var(--neutral-bg); color: var(--neutral-fg);
    font-size: 13px; font-weight: 700;
  }
  .org-chip.saas { background: var(--blue-soft); color: var(--blue); }
  .org-chip.rogue { background: var(--bad-bg); color: var(--bad-fg); }
  .cell-org { display: flex; align-items: center; gap: 10px; }

  /* ── 노드 아이콘 ── */

  /* ── 빈 상태 ── */
  .empty { padding: 24px 20px 26px; text-align: center; }
  .empty svg { width: 40px; height: 40px; stroke: #aab6c4; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 8px; }
  .empty p { font-size: 13px; line-height: 18px; color: var(--muted); margin-bottom: 12px; }

  /* ── 로그인 분할 ── */
  .login-split {
    display: grid; grid-template-columns: 300px 400px; width: 700px; max-width: 100%;
    border-radius: var(--r-modal); overflow: hidden; box-shadow: var(--shadow-overlay);
  }
  .login-brand { background: #0a2540; padding: 40px 36px; display: flex; flex-direction: column; justify-content: center; }
  .lb-logo { font: 700 30px/38px var(--sans); color: #fff; letter-spacing: -0.4px; display: flex; align-items: center; }
  .lb-logo small { font-family: var(--mono); font-size: 10px; color: #adbdcc; letter-spacing: .26em; margin-left: 10px; }
  .lb-tag { font-size: 14px; color: #adbdcc; margin: 6px 0 0; }
  .lb-desc { font-size: 14px; line-height: 22px; color: #d6e3ef; max-width: 40ch; margin-bottom: 20px; }
  .lb-points { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .lb-points li { position: relative; padding-left: 22px; font-size: 13.5px; line-height: 19px; color: #adbdcc; }
  .lb-points li::before {
    content: ""; position: absolute; left: 0; top: 3px; width: 13px; height: 13px;
    border-radius: 50%; background: rgba(77,161,240,.22);
    box-shadow: inset 0 0 0 4.5px rgba(77,161,240,.0), 0 0 0 0 transparent;
  }
  .lb-points li::after {
    content: ""; position: absolute; left: 3.5px; top: 7.5px; width: 6px; height: 3.5px;
    border-left: 1.6px solid #4ba1f0; border-bottom: 1.6px solid #4ba1f0; transform: rotate(-45deg);
  }
  .lb-foot { margin-top: auto; padding-top: 28px; font-size: 12px; color: #6b8299; }
  .login-card { background: var(--panel); border-radius: 0; box-shadow: none; width: auto; padding: 40px 38px 28px; }
  .lf-title { font: 600 20px/28px var(--sans); color: var(--ink); letter-spacing: -0.4px; }
  @media (max-width: 900px) {
    .login-split { grid-template-columns: 1fr; width: 400px; }
    .login-brand { display: none; }
  }

  /* ── 토스트 ── */
  #toasts { position: fixed; right: 24px; bottom: 24px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    display: flex; align-items: center; gap: 10px; min-width: 260px; max-width: 380px;
    background: var(--panel); border-radius: var(--r-pop); box-shadow: var(--shadow-overlay);
    padding: 11px 14px; font-size: 13.5px; color: var(--ink);
    border: 1px solid var(--line);
    animation: toast-in 200ms var(--ease) both;
  }
  .toast::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--disabled); flex: none; }
  .toast.ok::before { background: var(--st-ok); }
  .toast.bad::before { background: var(--st-over); }
  .toast.out { animation: toast-out 150ms var(--ease) both; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes toast-out { to { opacity: 0; } }

  /* ── D-day 배지 ── */
  .dday { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--neutral-bg); color: var(--neutral-fg); white-space: nowrap; }
  .dday.soon { background: var(--warn-bg); color: var(--warn-fg); }
  .dday.over { background: var(--bad-bg); color: var(--bad-fg); }

  /* ── 요약 칩 행 ── */
  .sumchips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sumchip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--body); background: var(--hover); border: 1px solid var(--hair); border-radius: 999px; padding: 3px 12px; }
  .sumchip b { font-weight: 600; color: var(--ink); }
  .sumchip.bad b { color: var(--bad-fg); }
  .lastscan { font-size: 13px; color: var(--disabled); margin-left: auto; }

  /* ── 상세 헤더 ── */
  .detail-hd { display: flex; align-items: center; gap: 12px; padding: 16px 20px 12px; }
  .detail-hd .t { font: 600 16px/24px var(--sans); color: var(--ink); }
  .detail-hd .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  /* ── 제출 전 점검 ── */
  .precheck { display: flex; flex-direction: column; gap: 0; }
  .precheck .pc { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--body); }
  .precheck .pc:first-child { border-top: none; }
  .precheck .pc .ic { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 700; }
  .precheck .pc.done .ic { background: #d7f7c2; color: #05690d; }
  .precheck .pc.todo .ic { background: var(--warn-bg); color: var(--warn-fg); }
  .precheck .pc .r { margin-left: auto; font-size: 13px; color: var(--muted); }

  /* 위저드 완료 단계 체크 */
  .wsteps .s.done { color: #45a557; border-color: #a4e0af; }

  /* 30. HoverArrow (Stripe) */
  .arrow-link { display: inline-flex; align-items: center; gap: 4px; }
  .arrow-link svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
  .arrow-link .stem { opacity: 0; transition: opacity 100ms var(--ease); }
  .arrow-link .head { transition: transform 150ms cubic-bezier(.215,.61,.355,1); }
  .arrow-link:hover .stem { opacity: 1; }
  .arrow-link:hover .head { transform: translateX(3px); }

  @media (max-width: 1020px) {
    .subnav-in { overflow-x: auto; padding: 0 16px; }
    .ai-state { display: none; }
    .content { padding: 16px 16px 44px; }
    .subgrid { grid-template-columns: 1fr; }
    .who .org { display: none; }
    .stat b { font-size: 24px; line-height: 30px; }
  }
  @media print {
    body * { visibility: hidden; }
    .report-page, .report-page * { visibility: visible; }
    .report-page { position: absolute; left: 0; top: 0; box-shadow: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .view, .modal, .ai-row { animation: none; }
    * { transition: none !important; }
  }
  /* ── 홈: 판정 한 줄 (위계는 크기가 아니라 굵기와 색) ── */
  .hero { display: flex; align-items: center; gap: 28px; padding: 0 2px 16px; }
  .verdict { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .verdict .vd { width: 8px; height: 8px; border-radius: 50%; background: var(--disabled); flex: none; }
  .verdict.ok .vd { background: var(--st-ok); }
  .verdict.bad .vd { background: var(--st-over); }
  .verdict .vk { font: 500 12px/16px var(--sans); color: var(--muted); }
  .verdict .vt { font: 600 22px/28px var(--sans); letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  .verdict .vt .n { color: var(--bad-fg); }
  .verdict .vs { font: 400 13px/18px var(--sans); color: var(--body); margin-top: 2px; }
  .hstats { display: flex; margin-left: auto; }
  .hstats div { padding: 0 24px; border-left: 1px solid var(--line); }
  .hstats div:first-child { border-left: 0; }
  .hstats b { display: block; font: 600 20px/24px var(--sans); letter-spacing: -0.01em; color: var(--ink); font-variant-numeric: tabular-nums; margin-bottom: 2px; }
  .hstats span { font: 400 12px/16px var(--sans); color: var(--muted); white-space: nowrap; }
  .hstats .warn b { color: var(--warn-fg); } .hstats .bad b { color: var(--bad-fg); }
  .hero button.act { height: 36px; padding: 0 16px; font-weight: 500; flex: none; }

  /* ── 홈: 지도. 밝은 표면 하나, 1px 경계선, 그림자 없음 ── */
  .mapwrap {
    --m-zone: #f4f6f9; --m-zone-end: #f0f3f7;
    --m-bz: #eef3fa; --m-bz-line: #9fb3cc;
    --m-node: #ffffff; --m-node-line: #d5dde7; --m-node-hover: #b9c7d8;
    --m-text-1: #0a2540; --m-text-2: #425466; --m-text-3: #697386;
    --m-edge: #5d85df; --m-edge-hover: #2157d1;
    --m-ok: #1f8a4c; --m-soon: #b7791f; --m-over: #c53030; --m-sel: var(--blue);
    position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-pop); overflow: hidden;
  }
  svg.map { display: block; width: 100%; padding: 8px 12px 0; }
  svg.map text { font-family: var(--sans); -webkit-font-smoothing: antialiased; pointer-events: none; }
  svg.map .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .edge, .edge-hit, .chip, .node, .bz, .halo { vector-effect: non-scaling-stroke; }

  .zone { fill: url(#zoneFill); stroke: none; }
  .zone-title { font-size: 12px; font-weight: 500; fill: var(--m-text-2); }
  .zone-n { font-size: 11px; font-weight: 500; fill: var(--m-text-3); }
  .zone-st { font-size: 11px; font-weight: 500; fill: var(--m-text-3); }
  .zdot.ok { fill: var(--m-ok); } .zdot.soon { fill: var(--m-soon); } .zdot.bad { fill: var(--m-over); }
  .ghost-t { font-size: 12px; fill: var(--m-text-3); }
  .ghost-t.ok { fill: var(--m-text-2); }

  .bz { fill: var(--m-bz); stroke: var(--m-bz-line); stroke-width: 1; }
  .bz-t { font-size: 11px; font-weight: 500; fill: #5b7393; letter-spacing: .04em; }

  .node { cursor: pointer; }
  .node rect.bg { fill: var(--m-node); stroke: var(--m-node-line); stroke-width: 1; transition: stroke var(--t); }
  .node:hover rect.bg { stroke: var(--m-node-hover); }
  .node.sel rect.bg { stroke: var(--m-sel); stroke-width: 1.5; }
  .node .ring { fill: none; stroke: rgba(33,87,209,.25); stroke-width: 1; opacity: 0; transition: opacity var(--t); }
  .node.sel .ring { opacity: 1; }
  .node .hi { stroke: none; }
  .node .nm { font-size: 13px; font-weight: 500; fill: var(--m-text-1); letter-spacing: -.01em; }
  .node.rogue .nm { font-family: var(--mono); font-size: 12.5px; }
  .node.rogue rect.bg { stroke: rgba(197,48,48,.45); }
  .node.rogue rect.tint { fill: rgba(197,48,48,.05); }
  .node.rogue:hover rect.bg { stroke: var(--m-over); }
  .node .chev { fill: none; stroke: var(--m-text-3); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
  .node .aux { font-size: 12px; font-weight: 500; fill: var(--m-text-2); }
  .mappop { position: absolute; z-index: 5; min-width: 240px; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-pop); box-shadow: var(--shadow-overlay); padding: 10px 12px; font-size: 12.5px; line-height: 18px; color: var(--body); pointer-events: none; opacity: 0; transition: opacity 120ms var(--ease); }
  .mappop.on { opacity: 1; }
  .mappop .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: var(--ink); }
  .mappop .ph b { font-weight: 600; } .mappop .ph .mono { font-size: 11px; color: var(--disabled); }
  .mappop .pr { display: flex; gap: 14px; align-items: center; }
  .mappop .pr b { font-weight: 600; color: var(--ink); } .mappop .pr b.bad { color: var(--bad-fg); }
  .mappop .pl { display: flex; flex-direction: column; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--ink); }
  .mappop .pl i { font-style: normal; color: var(--disabled); margin-left: 6px; }
  .mappop .pt { margin-top: 4px; color: var(--body); }
  .mappop .pf { margin-top: 6px; font-size: 11.5px; color: var(--blue); }
  table.tele { font-size: 13px; }
  table.tele tr.bad td { background: #fff7f7; }
  table.tele .note { font-size: 12px; color: var(--body); margin-left: 6px; }
  .ndot.ok { fill: var(--m-ok); } .ndot.soon { fill: var(--m-soon); } .ndot.over, .ndot.rogue { fill: var(--m-over); }

  .core-box { fill: #ffffff; stroke: #0a2540; stroke-width: 1.25; }
  .core-title { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .core-sub { font-size: 11px; font-weight: 500; fill: var(--m-text-3); }
  .core-div { stroke: var(--line); stroke-width: 1; }
  .core-k { font-size: 12px; fill: var(--m-text-3); }
  .core-v { font-size: 12.5px; font-weight: 500; fill: var(--ink); }
  .core-v.bad { fill: var(--bad-fg); } .core-v.ok { fill: var(--ok-fg); } .core-v.dim { fill: var(--disabled); font-weight: 400; }

  .edge { fill: none; stroke: var(--m-edge); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; transition: stroke var(--t); }
  .edge.soon { stroke: var(--m-soon); }
  .edge.over { stroke: var(--m-over); }
  .edge.rogue { stroke: var(--m-over); stroke-width: 1.5; stroke-dasharray: 3 4; }
  .edge.sel { stroke: var(--m-sel); stroke-width: 1.5; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .edge-hit:hover + .edge { stroke: var(--m-edge-hover); }
  .edge-hit:hover + .edge.soon { stroke: var(--m-soon); } .edge-hit:hover + .edge.over, .edge-hit:hover + .edge.rogue { stroke: var(--m-over); }
  .halo { fill: none; stroke: rgba(33,87,209,.12); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }

  .chip { cursor: pointer; }
  .chip .cut { fill: none; stroke: var(--m-bz); stroke-width: 4; }
  .chip .pill { fill: #ffffff; stroke: #9fb5e6; stroke-width: 1; transition: stroke var(--t); }
  .chip:hover .pill { stroke: var(--m-edge-hover); }
  .chip.soon .pill { stroke: var(--m-soon); } .chip.over .pill { stroke: var(--m-over); } .chip.sel .pill { stroke: var(--m-sel); }
  .chip .t { font-size: 10px; font-weight: 500; fill: #2f56b3; letter-spacing: .03em; }
  .chip.soon .t { fill: #8a5a10; } .chip.over .t { fill: var(--m-over); } .chip.sel .t { fill: var(--m-sel); }

  .maplegend { display: flex; gap: 20px; align-items: center; padding: 10px 20px; border-top: 1px solid var(--line); font: 400 12px/16px var(--sans); color: var(--muted); }
  .maplegend .grp { display: flex; gap: 16px; align-items: center; }
  .maplegend .grp + .grp { margin-left: 16px; padding-left: 20px; border-left: 1px solid var(--line); }
  .maplegend .hd { font: 500 11px/16px var(--sans); color: var(--disabled); margin-right: 2px; }
  .maplegend i { display: inline-block; width: 16px; height: 0; border-top: 1.25px solid #5d85df; margin-right: 8px; vertical-align: 3px; }
  .maplegend .s i { border-top: 1px solid #b7791f; }

/* 추론 서버 주소 결정. 우선순위: 주소의 llm 파라미터 > 배포본의 llm-endpoint.txt > localhost Ollama.
   배포 후 터널 주소가 바뀌면 llm-endpoint.txt만 다시 올리면 된다 */
(function(){
  const v = new URLSearchParams(location.search).get('llm');
  if (v) { window.SALPI_LLM_ENDPOINT = v; return; }
  if (location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname)) return;
  fetch('llm-endpoint.txt').then(r => r.ok ? r.text() : '').then(async t => {
    t = (t || '').trim();
    if (!t.startsWith('https://')) return;
    // 적힌 터널 주소가 죽어 있으면 무시하고 localhost로 남긴다 (시연자 맥에서는 직접 붙는다)
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(t + '/api/tags', { signal: ctl.signal });
      if (!r.ok) return;
    } catch (e) { return; }
    window.SALPI_LLM_ENDPOINT = t;
    if (typeof detProbe === 'function') detProbe();
    if (typeof initAIStatus === 'function') initAIStatus();
  }).catch(() => {});
})();
</script>

      let seen = 0;

    const h = /HOST=(\S+)/.exec(line), s = /SRC=(\S+)/.exec(line), p = /DPT=(\S+)/.exec(line);
    if (!h) continue;

const TELE_NAMES = ['김서연','박준호','이지우','최민재','정하윤','강도현','윤서아','임태양','한예린','오승민','신유진','조현우','배소율','권지훈','송나래','황민서','문채원','류시우','전다은','홍재민','노아인','서지안','백현준','안소현','장우진','구하은','남도윤','심예나','유건우','곽지민','마서진','표준서','엄채은','탁시현','변하람','원지호','길다인','방수아','석준영','피서윤'];
const TELE_DEPTS = ['영업2팀','여신심사팀','IT운영팀','준법감시팀','고객지원팀','리스크관리팀','상품개발팀'];
const TELE_REGIONS = ['서울','경기','인천','부산','대전'];
function teleInit(){
  const t0 = new Date(); const sessions = [];
  for (let i = 0; i < 23; i++) {
    const since = new Date(t0.getTime() - (20 + Math.floor(Math.random()*180))*60000);
    sessions.push({ id: 's'+i, user: TELE_NAMES[i], dept: TELE_DEPTS[i % TELE_DEPTS.length], region: TELE_REGIONS[i % 5],
      since: since.toTimeString().slice(0,5), mfa: true, check: 'ok', checkNote: '' });
  }
  return { sessions, next: 23, issues: 0 };
}
const TELE_FAIL = [['av','백신 정의 갱신 3일 경과'],['patch','OS 보안 패치 미적용'],['screen','화면 캡처 차단 에이전트 미실행']];
function teleTick(){
  const t = state.tele, f = state.feed;
  const r = Math.random(), forceFail = f.tick === 7 || f.tick === 19;
  if ((forceFail || r < 0.18) && t.sessions.length < 34) {   // 접속
    const name = TELE_NAMES[t.next % TELE_NAMES.length] + (t.next >= TELE_NAMES.length ? ' ' + (Math.floor(t.next/TELE_NAMES.length)+1) : '');
    const sess = { id: 's'+t.next, user: name, dept: TELE_DEPTS[t.next % TELE_DEPTS.length], region: TELE_REGIONS[t.next % 5], since: now().slice(0,5), mfa: true, check: 'ok', checkNote: '' };
    t.next++;
    if (forceFail || (f.tick > 30 && Math.random() < 0.12)) { const [k, note] = TELE_FAIL[Math.floor(Math.random()*TELE_FAIL.length)]; sess.check = 'fail'; sess.checkNote = note; t.issues++;
      logEvent('tele', `재택 세션 단말 점검 미통과 ${sess.user}(${sess.dept}), ${note}`); }
    t.sessions.push(sess);
  } else if (r > 0.84 && t.sessions.length > 12) {   // 종료
    const i = Math.floor(Math.random()*t.sessions.length); t.sessions.splice(i, 1);
  }
  f.lines.push(`${new Date().toISOString().slice(0,10)} ${now()} SRC=ext HOST=ra.paymon.co.kr DPT=443 ACTION=ALLOW`);
}
const teleStat = () => ({ n: state.tele.sessions.length, fail: state.tele.sessions.filter(x => x.check === 'fail').length });

/* ═══════════════ 활동 기록과 합성 피드 ═══════════════
   수집만 합성이다. 대조는 reconcile 그대로, 미확인 목적지 분류는 Kanana가 연결돼 있으면 실제 호출 */
const now = () => new Date().toTimeString().slice(0,8);
function logEvent(kind, text){
  state.events.push({ t: now(), kind, text });
  if (state.events.length > 200) state.events.shift();
  renderActivity();
}
const FEED_ROGUE_AT = { 4:'chatgpt.com', 10:'notion.so', 17:'anydesk.com', 26:'dropbox.com' };
function feedLine(){
  const f = state.feed, seen = Object.values(FEED_ROGUE_AT).filter((h,i) => Object.keys(FEED_ROGUE_AT)[i] <= f.tick);
  const approved = LEDGER.map(c => ({ host: c.domains[0], port: (c.ports||'443').split(',')[0].trim() }));
  const pick = Math.random();
  let host, port;
  if (FEED_ROGUE_AT[f.tick]) { host = FEED_ROGUE_AT[f.tick]; port = host === 'anydesk.com' ? '7070' : '443'; }
  else if (seen.length && pick < 0.22) { host = seen[Math.floor(Math.random()*seen.length)]; port = host === 'anydesk.com' ? '7070' : '443'; }
  else { const a = approved[Math.floor(Math.random()*approved.length)]; host = a.host; port = a.port; }
  const src = `10.20.${1+Math.floor(Math.random()*3)}.${2+Math.floor(Math.random()*60)}`;
  return `${new Date().toISOString().slice(0,10)} ${now()} SRC=${src} HOST=${host} DPT=${port} ACTION=ALLOW`;
}
function feedTick(){
  const f = state.feed; f.tick++;
  const n = 1 + Math.floor(Math.random()*2);
  for (let i=0;i<n;i++) f.lines.push(feedLine());
  teleTick();
  if (f.lines.length > 400) f.lines.splice(0, f.lines.length-400);
  f.received += n; f.last = now();
  const hitHosts = f.lines.slice(-(n+1)).map(l => ((l.match(/HOST=(\S+)/)||[])[1]||'').toLowerCase());
  const rec = reconcile(f.lines.join('\n'));
  const known = new Set(state.rogues.map(r => r.host));
  const fresh = rec.rogues.filter(r => !known.has(r.host));
  state.rogues = rec.rogues.map(r => state.rogues.find(x => x.host === r.host) ? Object.assign(state.rogues.find(x => x.host === r.host), { info: r.info }) : r);
  state.scanned = true; state.lastScan = f.last.slice(0,5);
  fresh.forEach(r => { logEvent('rogue', `미등록 발견 ${r.host}, 단말 ${r.info.srcs.size}대, 포트 ${[...r.info.ports].join(',')}`); classifyRogue(r); });
  // 지도는 미등록이 새로 생겼을 때만 다시 그리고, 평소엔 숫자만 갱신
  state.freshHosts = new Set(fresh.map(r => r.host));
  state.quiet = true;
  if ((state.tab === 'map' && fresh.length) || state.tab === 'activity' || state.tab === 'tele') render();
  else { renderStrip(); renderTabs(); renderObs(); renderActivity(); }
  state.quiet = false; state.freshHosts = null;
  if (state.tab === 'map') packets(hitHosts);
}
// 방금 관측된 줄마다 작은 점 하나가 허브에서 목적지까지 선을 따라 간다 (실데이터 기반 움직임)
const SVGNS = 'http://www.w3.org/2000/svg';
function fractionAt(path, x, y){
  const L = path.getTotalLength(); let best = 0, bd = 1e9;
  for (let i = 0; i <= 80; i++) { const pt = path.getPointAtLength(L*i/80); const d = (pt.x-x)**2 + (pt.y-y)**2; if (d < bd) { bd = d; best = i/80; } }
  return best;
}
function runPacket(path, from, to, dur, cls, delay){
  const svg = path.ownerSVGElement; if (!svg) return;
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('r', '2.2'); c.setAttribute('class', 'pkt ' + (cls||''));
  const am = document.createElementNS(SVGNS, 'animateMotion');
  am.setAttribute('dur', dur + 'ms'); am.setAttribute('begin', 'indefinite'); am.setAttribute('fill', 'freeze');
  am.setAttribute('calcMode', 'linear'); am.setAttribute('keyPoints', `${from};${to}`); am.setAttribute('keyTimes', '0;1');
  const mp = document.createElementNS(SVGNS, 'mpath'); mp.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#' + path.id);
  am.appendChild(mp); c.appendChild(am); svg.appendChild(c);
  setTimeout(() => { am.beginElement(); setTimeout(() => c.remove(), dur + 80); }, delay || 0);
}
function packets(hosts){
  const svg = document.querySelector('svg.map'); if (!svg) return;
  hosts.forEach((h, i) => {
    const delay = i * 260;
    const c = matchLedger(h);
    if (c) { const p = svg.querySelector(`#e-${c.id}`); if (p) { if (c.zone === 'tele') runPacket(p, 0, 1, 1100, '', delay); else runPacket(p, 1, 0, 1100, '', delay); } return; }   // 승인 통로는 노드 → 허브 순으로 그려져 있다. 아웃바운드는 거꾸로, 재택(인바운드)은 정방향
    const k = state.rogues.findIndex(r => r.host === h); if (k < 0) return;
    const n = state.rogues.length, trunk = svg.querySelector(`#e-R-${n-1}`); if (!trunk) return;
    if (k === n-1) { runPacket(trunk, 0, 1, 1300, 'rogue', delay); return; }
    const stub = svg.querySelector(`#e-R-${k}`); if (!stub) return;
    const sp = stub.getPointAtLength(0);
    const f = fractionAt(trunk, sp.x, sp.y);
    runPacket(trunk, 0, f, 900*f + 300, 'rogue', delay);
    runPacket(stub, 0, 1, 350, 'rogue', delay + 900*f + 300);
  });
}
function renderObs(){
  const el = $('#obs-nums'); if (!el) return;
  const f = state.feed;
  el.innerHTML = `<span>수신 <b class="mono">${f.received}</b>줄</span>
      <span>목적지 <b class="mono">${new Set(f.lines.map(l => (l.match(/HOST=(\S+)/)||[])[1])).size}</b>곳</span>
      <span>미등록 <b class="mono">${state.rogues.length}</b></span>
      <span>AI 분류 <b class="mono">${f.aiCount}</b>건</span>`;
  const src = $('#obs-src'); if (src) src.textContent = '데모 피드(합성)' + (f.last ? ', 마지막 수신 ' + f.last : '');
}
async function classifyRogue(r){
  if (!state.detReady) { logEvent('ai', `${r.host} 내장 분류: ${r.cls.kind} (AI 미연결)`); return; }
  r.cls = Object.assign({}, r.cls, { kind: '분류 중', pending: true });
  const t0 = performance.now();
  let out = null;
  try { out = await SalpiEngine.llmClassifyHost(r.host, { count: r.info.count, devices: r.info.srcs.size, ports: [...r.info.ports] }); } catch (e) { out = null; }
  const live = state.rogues.find(x => x.host === r.host); if (!live) return;
  if (out) { live.cls = Object.assign({}, CLASSIFY[r.host] || {}, out); state.feed.aiCount++;
    logEvent('ai', `${r.host} AI 분류 ${out.kind}${out.saasLike?' (SaaS형)':''}, ${out.risk} (${((performance.now()-t0)/1000).toFixed(1)}s)`); }
  else { live.cls = Object.assign({}, CLASSIFY[r.host] || { kind:'미분류', saasLike:false, risk:'승인 대장의 어느 통로에도 해당하지 않는 외부 연결' }); logEvent('ai', `${r.host} AI 판단 보류(미분류), 내장 분류 ${live.cls.kind}`); }
  if (state.tab === 'map') render();
}
async function startFeed(){
  const f = state.feed;
  if (!f.started) { f.started = true; const av = await SalpiEngine.llmAvailable(); state.detReady = !!(av.ok && av.hasModel);
    logEvent('sys', state.detReady ? 'AI 연결 확인, 미확인 목적지를 Kanana가 분류' : 'AI 미연결, 내장 분류로 동작'); }
  f.on = true; logEvent('sys', '관측 시작, 데모 피드(합성)');
  f.timer = setInterval(feedTick, 2500); feedTick();
}
function pauseFeed(){ const f = state.feed; f.on = false; clearInterval(f.timer); f.timer = null; logEvent('sys', '관측 일시정지'); render(); }
const EV_KO = { rogue:'발견', ai:'AI', block:'차단', register:'등재', content:'검사', scan:'대조', sys:'상태', tele:'재택' };

/* ═══════════════ 등재 위저드 (살피 판정의 이식) ═══════════════ */
const USAGES = [
  { key:'doc',  t:'사내 문서 작성과 관리' }, { key:'chat', t:'사내 메신저와 협업' },
  { key:'meet', t:'화상회의' },              { key:'pm',   t:'프로젝트와 업무 관리' },
];
const NATURES = [
  { key:'none',     grade:0, t:'고객 정보가 업무상 등장하지 않음', d:'순수 내부 업무' },
  { key:'id_only',  grade:1, t:'고객 식별정보가 단독으로 등장할 수 있음', d:'이름, 연락처 수준. 신용정보와 결합 안 됨' },
  { key:'combined', grade:2, t:'고객 식별정보가 거래나 상담 내용과 결합될 수 있음', d:'결합되면 개인신용정보 (신용정보법 제2조)' },
  { key:'unique',   grade:3, t:'주민등록번호 등 고유식별정보가 유입될 수 있음', d:'그 자체로 요건 저촉' },
  { key:'intent',   grade:4, t:'고객 정보를 다루는 것이 이 업무의 목적임', d:'"처리하지 않는 이용 목적"이 아님' },
];
const KNOWN_SAAS = { 'notion.so':'notion', 'dooray.com':'dooray', 'office.com':'m365', 'zoom.us':'zoom', 'slack.com':'slack' };

function openWizard(prefill){
  const key = Object.entries(KNOWN_SAAS).find(([d]) => (prefill.host||'').endsWith(d))?.[1] || prefill.saasKey || null;
  state.wiz = {
    step: 0, host: prefill.host || '', name: prefill.name || prefill.host || '',
    saasKey: key, entries: saasEntriesFor(key),
    usage: null, nature: null, l1: null, applied: {}, comp: {},
    fromRogue: prefill.fromRogue || null, cls: prefill.cls || null,
  };
  renderWizard();
  $('#overlay').classList.add('open');
}
function closeWizard(){ $('#overlay').classList.remove('open'); state.wiz = null; }

function wizJudge(w){
  const risks = [], oks = [];
  if (w.nature === 'intent')
    return { grade:'bad', title:'예외 적용 불가', risks:[{lv:'r', t:'고객 정보를 다루는 것이 업무 목적 자체. 제1항 3호의 "처리하지 않는 이용 목적"에 해당하지 않음. 혁신금융서비스 경로 또는 차단.'}], oks };
  if (w.l1 === 'yes')
    return { grade:'bad', title:'예외 적용 불가', risks:[{lv:'r', t:'고객정보 필드형 기능 사용 계획. 구조화된 저장과 검색으로서 명백한 처리.'}], oks };
  const risky = ['combined','unique'].includes(w.nature);
  if (w.nature === 'unique') risks.push({lv:'w', t:'고유식별정보 유입 가능성. 입력 차단 통제 필수.'});
  const ctrl = w.entries.filter(e => (e.layer==='L2'||e.layer==='L3') && e.exists!=='no');
  if (!ctrl.length) {
    // 근거 미수집 SaaS. 실서비스는 E 파이프라인(LLM 문서 추출)이 수집
    if (risky) risks.push({lv:'r', t:'통제 근거 미수집 상태에서 고객 정보 유입 가능 용도. 등재 불가. 근거 수집(E 파이프라인) 후 재판정하거나 차단.'});
    else risks.push({lv:'w', t:'통제 근거 미수집. 조건부 등재하고 벤더 문서 근거 수집을 등재 조건으로 부기.'});
  }
  for (const e of ctrl) {
    const has = ['builtin','higher_tier','third_party'].includes(e.control_availability);
    const applied = w.applied[e._i], comp = w.comp[e._i];
    if (has && applied) oks.push({lv:'g', t:`${e.feature}: 적용 계획 확인`});
    else if (!has && comp) risks.push({lv:'w', t:`${e.feature}: 벤더 미제공. 살피 내용검사를 보완통제로 지정`});
    else if (risky) risks.push({lv:'r', t:`${e.feature}: 통제 미적용. 유입 가능 용도에서 접점 열림`});
    else risks.push({lv:'w', t:`${e.feature}: 통제 미적용 (권고)`});
  }
  const hard = risks.filter(r => r.lv==='r').length;
  if (hard) return { grade:'bad', title:'조건 미충족, 등재 불가', risks, oks };
  if (risks.length) return { grade:'cond', title:'조건부 적합, 등재 가능', risks, oks };
  return { grade:'ok', title:'예외 요건 충족, 등재 가능', risks, oks };
}

function renderWizard(){
  const w = state.wiz; if (!w) return;
  const steps = ['대상', '용도', '데이터 성격', 'L1 필드', '통제 확인', '판정'];
  const bar = `<div class="wsteps">${steps.map((s,i)=>`<div class="s ${i===w.step?'on':i<w.step?'done':''}">${i<w.step?'✓':(i+1)} ${s}</div>`).join('')}</div>`;
  const nav = (canNext, nextLabel='다음') => `<div class="wnav">
    <button class="act ghost2 small" onclick="${w.step===0?'closeWizard()':'wizBack()'}">${w.step===0?'취소':'이전'}</button>
    <button class="act small" id="wnext" ${canNext?'':'disabled'}>${nextLabel}</button></div>`;
  let body = '';

  if (w.step === 0) {
    body = `<p style="font-size:12.5px">등재 대상: <b>${esc(w.name)}</b> ${w.host?`<span class="mono" style="color:var(--faint)">(${esc(w.host)})</span>`:''}</p>
      ${w.cls ? `<p style="font-size:12px;color:var(--sub)">로그 대조에서 발견. 분류: ${w.cls.kind}</p>` : ''}
      <p style="font-size:12px;color:var(--sub)">${w.entries.length ? `통제 근거 ${w.entries.length}건` : '통제 근거 없음'}</p>` + nav(true);
  }
  if (w.step === 1) body = USAGES.map(u=>`<div class="opt ${w.usage===u.key?'sel':''}" data-w="usage:${u.key}"><span class="mark"></span><span class="t">${u.t}</span></div>`).join('') + nav(!!w.usage);
  if (w.step === 2) body = NATURES.map(n=>`<div class="opt ${w.nature===n.key?'sel':''}" data-w="nature:${n.key}"><span class="mark"></span><span><span class="t">${n.t}</span><div class="d">${n.d}</div></span></div>`).join('') + nav(!!w.nature);
  if (w.step === 3) body = `

        <span>${has?'도입 시 적용':'벤더 미제공. <b>살피 내용검사를 보완통제로 지정</b>'}</span></label></div>`;
    }).join('') + nav(true, '판정')
    : `<p style="font-size:12.5px;color:var(--sub)">통제 근거 없음. 미수집 상태로 판정</p>` + nav(true, '판정');
  }
  if (w.step === 5) {
    const v = wizJudge(w);

    body = `<div class="verdict-line ${v.grade==='ok'?'ok':v.grade==='cond'?'cond':'bad'}"><div class="word">${v.title}</div></div>

      ${v.oks.map(r=>`<div class="finding g"><span class="ic">○</span><span>${r.t}</span></div>`).join('')}</div>
      <div class="wnav">
        <button class="act ghost2 small" onclick="wizBack()">이전</button>
        <span style="display:flex;gap:8px">
          ${v.grade==='bad' && w.fromRogue!=null ? `<button class="act danger small" onclick="wizBlock()">차단 확정</button>` : ''}
          ${v.grade!=='bad' ? `<button class="act small" onclick="wizRegister()">대장에 등재 (위원회 상정)</button>` : ''}
          ${v.grade==='bad' && w.fromRogue==null ? `<button class="act ghost2 small" onclick="closeWizard()">닫기</button>` : ''}
        </span></div>`;
  }

  $('#modal').innerHTML = `<h3>SaaS 통로 등재 판정</h3>
    <div class="wsub">시행세칙 제2조의3 제1항 제3호 적격 검토. <a href="workbench.html" target="_blank">전체 워크벤치</a></div>
    ${bar}${body}`;
  document.querySelectorAll('[data-w]').forEach(el => el.onclick = () => {
    const [k, val] = el.dataset.w.split(':'); state.wiz[k === 'l1' ? 'l1' : k] = val; renderWizard();
  });
  document.querySelectorAll('[data-wc]').forEach(el => el.onchange = () => {

  });
  const next = $('#wnext');
  if (next) next.onclick = () => { state.wiz.step++; renderWizard(); };
}

function wizRegister(){

/* 통로 유형 분포 도넛 (SVG stroke-dasharray) */
function donutSVG(){
  const groups = {};
  for (const c of LEDGER) groups[c.type] = (groups[c.type]||0)+1;
  const colors = ['#2157d1','#7fa6ef','#bcd0f5','#84d59b','#f3d27f'];
  const total = LEDGER.length || 1;
  const R = 15, C = 2*Math.PI*R;
  let off = 0, segs = '';
  Object.values(groups).forEach((n,i)=>{
    const len = n/total*C;
    segs += `<circle r="${R}" cx="19" cy="19" fill="none" stroke="${colors[i%colors.length]}" stroke-width="7"
      stroke-dasharray="${Math.max(len-1.6,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 19 19)"/>`;
    off += len;
  });
  return `<svg width="38" height="38" viewBox="0 0 38 38">${segs}</svg>`;
}
function sparkSVG(){
  const hist = [0,1,0,2, state.scanned ? state.rogues.length + state.blocked.length : 0];
  const max = Math.max(...hist, 1);
  const calm = !state.scanned;
  return `<span class="spark ${calm?'calm':''}">${hist.map((v,i)=>
    `<i class="${i===hist.length-1&&!calm?'now':''}" style="height:${Math.max(v/max*34,4)}px"></i>`).join('')}</span>`;
}
function renderStrip(){
  const saasDue = LEDGER.filter(c => c.review.soon && c.review.type.includes('반기')).length;
  const reviewDue = LEDGER.filter(c => c.review.soon && !c.review.type.includes('반기')).length;
  const detects = Object.values(state.contentLog).reduce((n,a)=>n+a.length,0);
  const items = [
    { n: LEDGER.length, l:'승인된 통로', viz: donutSVG() },
    { n: saasDue, l:'반기 평가 예정', cls: saasDue?'warn':'' },
    { n: reviewDue, l:'재승인 필요', cls: reviewDue?'warn':'' },
    { n: state.scanned ? state.rogues.length : '-', l:'미등록 연결', cls: state.rogues.length?'bad':'', viz: sparkSVG() },
    { n: detects, l:'위반 탐지', cls: detects?'ok':'' },
  ];
  if (state.blocked.length) items.push({ n: state.blocked.length, l:'차단 확정' });
  $('#strip').innerHTML = items.map(it =>
    `<div class="stat ${it.cls||''}"><span class="tx"><span class="l">${it.l}</span><b>${it.n}</b></span>${it.viz?`<span class="viz">${it.viz}</span>`:''}</div>`).join('');
}

/* ── 지도 ── */
function renderMap(){
  const W=1400, ROGUES=state.rogues;
  const RZ = W-36-252, RN = RZ+16;   // 오른쪽 구역 x, 오른쪽 노드 x
  const zoneOf = z => LEDGER.filter(c => c.zone === z);
  const fin=zoneOf('fin'), saas=zoneOf('saas'), remote=zoneOf('remote'), dmz=zoneOf('dmz'), tele=zoneOf('tele');
  const h_n = 44;
  const H = Math.max(420 + 36 + dmz.length*52 + 32, 372 + 36 + ROGUES.length*52 + 32, 560);
  const core = { x:W/2-130, y:292, w:260, h:128 };
  // 내부 업무망 경계. 통로 선이 이 경계를 수직으로 뚫고, 뚫는 자리에 통로 알약이 앉는다
  const bz = { x: core.x-48, y: core.y-40, w: core.w+96, h: core.h+80 };
  let base='', out='', edges='', chips='', flows='', flowN=0;

  const daysTo = due => { const p=due.split('-').map(Number); return Math.ceil((new Date(p[0],p[1]-1,p[2]||28) - new Date())/86400000); };
  const stOf = c => { const n=daysTo(c.review.due); return n<0?'over':(c.review.soon||n<=45)?'soon':'ok'; };
  const zoneSt = list => {
    const over = list.filter(c=>stOf(c)==='over').length, soon = list.filter(c=>stOf(c)==='soon').length;
    return over ? {cls:'bad',t:'기한 경과 '+over} : soon ? {cls:'soon',t:'점검 임박 '+soon} : {cls:'ok',t:'정상'};
  };

  // 카드: 어두운 표면, 상태점, 이름. 통로 번호는 경계 통과 지점의 알약에만
  const nodeBox=(x,y,w,id,name,sel,rogue,st,aux)=>`
    <g class="node ${sel?'sel':''} ${rogue?'rogue':''} ${rogue && state.freshHosts && state.freshHosts.has(name) ? 'enter' : ''}" data-sel="${id==='?'?name:id}">
      <rect class="ring" x="${x-3}" y="${y-3}" width="${w+6}" height="${h_n+6}" rx="9"></rect>
      <rect class="bg" x="${x}" y="${y}" width="${w}" height="${h_n}" rx="6"></rect>
      ${rogue?`<rect class="tint" x="${x}" y="${y}" width="${w}" height="${h_n}" rx="6"></rect>`:''}
      <line class="hi" x1="${x+8}" y1="${y+1.5}" x2="${x+w-8}" y2="${y+1.5}"></line>
      <circle class="ndot ${rogue?'rogue':st}" cx="${x+16}" cy="${y+22}" r="3"></circle>
      <text class="nm" x="${x+28}" y="${y+26.5}">${esc(name)}</text>
      ${aux?`<text class="aux mono" x="${x+w-14}" y="${y+26.5}" text-anchor="end">${esc(aux)}</text>`:''}
      ${rogue?`<path class="chev" d="M${x+w-18} ${y+17} l5 5 -5 5"></path>`:''}
    </g>`;
  // 직각 배선, 모서리 반경 8. 선은 경계를 수직으로 뚫고, 뚫는 자리에 알약이 앉는다
  const R = 8;
  const textW = (str, size) => [...str].reduce((w,ch)=> w + size*(/[가-힣]/.test(ch)?1:/[A-Z]/.test(ch)?.68:/[a-z0-9]/.test(ch)?.56:.3), 0);
  // 버스는 바깥 노드일수록 바깥쪽(k가 작을수록 큰 간격)이라 수평 구간이 다른 수직 버스를 가로지르지 않는다
  const edgeH = (x1,y1,x2,y2,k,n,outerFirst=true) => {
    const dir = x2 > x1 ? 1 : -1;
    if (y1 === y2) return `M${x1} ${y1} H${x2}`;
    const sy = y2 > y1 ? 1 : -1, r = Math.min(R, Math.abs(y2-y1)/2);
    const xm = x1 + dir*(44 + (outerFirst ? (n-1-k) : k)*12);
    const s1 = dir*sy > 0 ? 1 : 0;
    return `M${x1} ${y1} H${xm-dir*r} a${r} ${r} 0 0 ${s1} ${dir*r} ${sy*r} V${y2-sy*r} a${r} ${r} 0 0 ${1-s1} ${dir*r} ${sy*r} H${x2}`;
  };
  const edgeV = (x1,y1,x2,y2,yj) => {
    const sy = y2 > y1 ? 1 : -1;
    if (x1 === x2) return `M${x1} ${y1} V${y2}`;
    const dir = x2 > x1 ? 1 : -1, r = Math.min(R, Math.abs(x2-x1)/2);
    const s1 = dir*sy > 0 ? 0 : 1;
    return `M${x1} ${y1} V${yj-sy*r} a${r} ${r} 0 0 ${s1} ${dir*r} ${sy*r} H${x2-dir*r} a${r} ${r} 0 0 ${1-s1} ${dir*r} ${sy*r} V${y2}`;
  };
  const edge = (d, key, sel, kind, cp) => {
    const enter = kind==='rogue' && state.freshHosts && [...state.freshHosts].some(h => state.rogues.findIndex(r => r.host===h) === Number(key.slice(2)));
    edges += `${sel?`<path class="halo" d="${d}"></path>`:''}<path class="edge-hit" d="${d}" data-sel="${key}"></path><path id="e-${key}" class="edge ${kind} ${sel?'sel':''} ${enter?'enter':''}" d="${d}" data-sel="${key}"></path>`;
    if (cp) chips += `<g class="chip ${kind==='rogue'?'':kind} ${sel?'sel':''}" data-sel="${key}">
      <rect class="cut" x="${cp.x-22}" y="${cp.y-9}" width="44" height="18" rx="9"></rect>
      <rect class="pill" x="${cp.x-22}" y="${cp.y-9}" width="44" height="18" rx="9"></rect>
      <text class="t mono" x="${cp.x}" y="${cp.y+3.5}" text-anchor="middle">${key}</text></g>`;
  };
  const zoneFrame=(x,y,w,h,title,n,st)=>{
    let right='';
    if (st) { const tw = st.t.replace(/\s/g,'').length*9 + (st.t.split(' ').length-1)*4;
      right = `<circle class="zdot ${st.cls}" cx="${x+w-16-tw-9}" cy="${y+18}" r="3"></circle>
        <text class="zone-st ${st.cls}" x="${x+w-16}" y="${y+22}" text-anchor="end">${st.t}</text>`; }
    base += `<rect class="zone" x="${x}" y="${y}" width="${w}" height="${h}" rx="12"></rect>`;
    return `<text class="zone-title" x="${x+16}" y="${y+22}">${title}</text>
      <text class="zone-n mono" x="${x+16+textW(title,12)+8}" y="${y+22}">${n}</text>${right}`;
  };
  out += `<defs>
    <linearGradient id="zoneFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#f0f3f7"/></linearGradient>
    <radialGradient id="bzGlow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="hubShadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0a2540" stop-opacity=".10"/><stop offset=".6" stop-color="#0a2540" stop-opacity=".03"/><stop offset="1" stop-color="#0a2540" stop-opacity="0"/></radialGradient>
  </defs>`;

  // 경계 (선보다 먼저 그려 선이 위를 지나게)
  base += `<rect class="bz" x="${bz.x}" y="${bz.y}" width="${bz.w}" height="${bz.h}" rx="14"></rect>
    <rect x="${bz.x}" y="${bz.y}" width="${bz.w}" height="${bz.h}" rx="14" fill="url(#bzGlow)" pointer-events="none"></rect>`;
  out += `<text class="bz-t" x="${bz.x+16}" y="${bz.y+22}">내부 업무망 경계</text>`;

  const PITCH = 52, ZT = 36, ZB = 16, FP = 22;
  // 외부기관 (좌상): 허브 왼쪽 위에서 진입
  out += zoneFrame(36, 116, 252, ZT+fin.length*PITCH+ZB, '외부기관', fin.length, zoneSt(fin));
  fin.forEach((c,k)=>{ const y=116+ZT+k*PITCH, y2 = core.y + 20 + k*FP;
    out += nodeBox(52, y, 220, c.id, c.name, state.sel===c.id, false, stOf(c));
    edge(edgeH(272, y+22, core.x, y2, k, fin.length), c.id, state.sel===c.id, stOf(c), {x: bz.x, y: y2});
  });
  // DMZ, 계열사 (좌하): 허브 왼쪽 아래에서 진입
  const DY = 420;
  out += zoneFrame(36, DY, 252, ZT+dmz.length*PITCH+ZB, 'DMZ / 계열사', dmz.length, zoneSt(dmz));
  dmz.forEach((c,k)=>{ const y=DY+ZT+k*PITCH+22, xe = core.x + 36 + k*56;
    out += nodeBox(52, y-22, 220, c.id, c.name, state.sel===c.id, false, stOf(c));
    edge(`M272 ${y} H${xe-R} a${R} ${R} 0 0 0 ${R} ${-R} V${core.y+core.h}`, c.id, state.sel===c.id, stOf(c), {x: xe, y: bz.y+bz.h});
  });
  // SaaS (상): 허브 위에서 수직 진입
  const sw = Math.max(2,saas.length)*206, sx = (core.x+core.w/2) - sw/2;
  out += zoneFrame(sx-18, 36, sw+36, ZT+h_n+ZB, 'SaaS', saas.length, zoneSt(saas));

    out += nodeBox(x, 36+ZT, 188, c.id, c.name, state.sel===c.id, false, stOf(c));
    edge(edgeV(xc, 36+ZT+h_n, xe, core.y, bz.y-26), c.id, state.sel===c.id, stOf(c), {x: xe, y: bz.y});
  });

  remote.forEach((c,k)=>{ const y=RMY+ZT+k*PITCH, kk = k + tele.length, y2 = core.y + 20 + kk*FP;

        <span class="grp"><span class="hd">기한</span><span class="d"><em class="ok"></em>정상</span><span class="d"><em class="soon"></em>임박</span><span class="d"><em class="over"></em>경과</span></span>

function bindMapHover(){
  const wrap = document.querySelector('.mapwrap'); if (!wrap) return;
  let pop = wrap.querySelector('.mappop');
  if (!pop) { pop = document.createElement('div'); pop.className = 'mappop'; wrap.appendChild(pop); }
  wrap.querySelectorAll('g.node').forEach(g => {
    g.addEventListener('mouseenter', () => {
      const html = popContent(g.dataset.sel); if (!html) return;
      pop.innerHTML = html;
      const wr = wrap.getBoundingClientRect(), nr = g.getBoundingClientRect();
      pop.classList.add('on');
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = nr.left - wr.left, top = nr.bottom - wr.top + 8;
      if (left + pw > wr.width - 12) left = wr.width - pw - 12;
      if (top + ph > wr.height - 12) top = nr.top - wr.top - ph - 8;
      pop.style.left = left + 'px'; pop.style.top = top + 'px';
    });
    g.addEventListener('mouseleave', () => pop.classList.remove('on'));
  });
}

function quickBlock(host){

}

const DROP_KO = {
  span_not_in_source: '원문에 없는 근거, 폐기',
  identifier_not_in_span: '근거 밖 이름 지목, 폐기',
  combined_missing_parts: '결합 요소 불명, 폐기',
  bad_label: '형식 벗어난 판정, 폐기',
  empty_span: '근거 없음, 폐기',
  invalid_json: '형식 오류, 폐기',
  call_failed: '호출 실패',
};
function aiEvent(ev){
  const live = $('#ai-live'), rows = $('#ai-rows'); if (!live || !rows) return;
  if (ev.type === 'start') {
    live.style.display = 'block'; rows.innerHTML = '';
    $('#ai-model').textContent = 'Kanana-2-3B ' + (window.SALPI_LLM_ENDPOINT ? '원격' : '로컬');
    $('#ai-stat').textContent = '문서를 창 ' + ev.windows + '개로 분할';
    $('#ai-prog').style.width = '0%';
  }
  if (ev.type === 'window') {
    rows.insertAdjacentHTML('beforeend', `<div class="ai-row pending" id="ai-w${ev.i}">
      <span class="no">${ev.i}/${ev.total}</span>
      <span class="chunk">${esc(ev.chunk.replace(/\n/g, ' ⏎ ').slice(0, 90))}</span>
      <span class="out"></span><span class="ms"></span></div>`);
    rows.lastElementChild.scrollIntoView({ block: 'nearest' });
  }
  if (ev.type === 'result') {
    const row = $('#ai-w' + ev.i); if (!row) return;
    row.classList.remove('pending');
    const out = row.querySelector('.out');
    const parts = [];
    ev.accepted.forEach(a => parts.push(`<span class="badge ${a.label==='identifier'?'gray':'bad'}">${a.label==='combined'?'결합 위반':a.label==='unique_id'?'고유식별정보':'식별정보'}</span>`));
    ev.dropped.forEach(d => parts.push(`<span class="badge warn">${DROP_KO[d.reason]||d.reason}</span>`));
    if (!parts.length) parts.push('<span class="badge ok">이상 없음</span>');
    out.innerHTML = parts.join('');
    row.querySelector('.ms').textContent = (ev.ms/1000).toFixed(1) + 's';
    $('#ai-prog').style.width = Math.round(ev.i/ev.total*100) + '%';
  }
  if (ev.type === 'result') {
    ev.accepted.forEach(a => logEvent('content', `AI 판정 창 ${ev.i}/${ev.total} 채택: ${a.label==='combined'?'결합 위반':a.label==='unique_id'?'고유식별정보':'식별정보'}`));
    ev.dropped.forEach(d => logEvent('content', `AI 판정 창 ${ev.i}/${ev.total} 폐기: ${DROP_KO[d.reason]||d.reason}`));
  }
  if (ev.type === 'done') {
    logEvent('content', `AI 판정 완료, 창 ${ev.windows}개, 채택 ${ev.accepted}건, 폐기 ${ev.dropped}건`);
    $('#ai-stat').textContent = `창 ${ev.windows}개 판정 완료, 채택 ${ev.accepted}건, 검증 폐기 ${ev.dropped}건`;
    $('#ai-prog').style.width = '100%';
  }
}
async function detRun(){
  const ta = $('#det-in'), out = $('#det-out'), note = $('#det-note');
  if (!ta || !out) return;
  if (!ta.value.trim()) { out.innerHTML = ''; out.style.display = 'none'; note.innerHTML = ''; $('#ai-live').style.display = 'none'; return; }
  const seq = ++detSeq;
  out.style.display = 'block';
  if (state.detMode !== 'heuristic') out.innerHTML = '<div class="det-empty">정밀 검사 중…</div>';
  else $('#ai-live').style.display = 'none';
  const res = await SalpiEngine.scan(ta.value, { mode: state.detMode, llm: { onEvent: aiEvent } });
  if (seq !== detSeq) return;
  const target = $('#det-target')?.value || 'C-05';
  const viols = res.hits.filter(h => h.severity==='violation');
  if (viols.length) {
    state.contentLog[target] = (state.contentLog[target]||[]).concat(
      viols.map(v => ({ t: Date.now(), tag: v.tag, masked: mask(v.span).slice(0,60) }))).slice(-100);
    renderStrip();
  }
  out.innerHTML = (res.degraded?`<div class="det-empty" style="color:var(--amber)">${esc(res.degraded)}</div>`:'') +
    (res.hits.length ? res.hits.map(h => {
      const lv = h.severity==='violation'?'viol':(h.label==='identifier_only'?'info':'warn');
      return `<div class="det-hit ${lv}"><span class="tag">[${esc(h.tag)}]</span><span class="span">${esc(h.span.slice(0,64))}</span><span class="note">${esc(h.note)}</span></div>`;
    }).join('') : '<div class="det-empty">탐지된 항목 없음</div>');
  note.innerHTML = viols.length ? `<div class="hint">위반 ${viols.length}건 기록됨, ${target}. 마스킹 저장</div>` : '';
}

/* ── 상단바 검색 ── */
function searchTargets(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  const hits = [];
  for (const c of LEDGER) {
    if (c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q) || c.domains.some(d=>d.includes(q)))
      hits.push({ id: c.id, name: c.name, host: c.domains[0] });
  }
  for (const r of state.rogues) {
    if (r.host.includes(q)) hits.push({ id: 'R-'+state.rogues.indexOf(r), name: r.host, host: '미등록', rogue: true });
  }
  return hits.slice(0, 8);
}
function initSearch(){
  const inp = $('#tsearch-in'), drop = $('#tsearch-drop');
  if (!inp) return;
  const close = () => drop.classList.remove('open');
  inp.oninput = () => {
    const hits = searchTargets(inp.value);
    if (!inp.value.trim()) { close(); return; }
    drop.innerHTML = hits.length ? hits.map(h =>
      `<div class="tsearch-item" data-goto="${h.id}"><span class="ti-id">${h.rogue?'!':h.id}</span><span>${esc(h.name)}</span><span class="ti-host">${esc(h.host)}</span></div>`).join('')
      : '<div class="tsearch-empty">검색 결과 없음</div>';
    drop.classList.add('open');
    drop.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
      close(); inp.value = '';
      state.tab = 'map'; state.sel = el.dataset.goto; render();
    });
  };
  inp.onkeydown = e => { if (e.key === 'Escape') { close(); inp.blur(); } };
  document.addEventListener('click', e => { if (!e.target.closest('.tsearch')) close(); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); inp.focus(); }
  });
}
