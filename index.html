<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살피 SALPI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff;
    --line: #e5e7ec; --line2: #d5d8df;
    --ink: #1a1c20; --sub: #5f6470; --faint: #9aa0ab;
    --blue: #2f6bff; --blue-dark: #2456d6; --blue-bg: #eef3ff;
    --green: #0e9f6e; --green-bg: #e6f6f0;
    --amber: #b45309; --amber-bg: #fdf3e3;
    --red: #d92d20; --red-bg: #fdecea;
    --mono: "IBM Plex Mono", monospace;
    --sans: "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 13.5px; line-height: 1.6; word-break: keep-all; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  ::selection { background: var(--blue-bg); }

  /* ── 앱바 ── */
  header.appbar { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  header.appbar .in { max-width: 1320px; margin: 0 auto; padding: 0 28px; display: flex; align-items: center; height: 58px; gap: 34px; }
  h1.brand { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  h1.brand small { font-family: var(--mono); font-size: 8.5px; font-weight: 500; color: var(--faint); letter-spacing: .26em; margin-left: 8px; }
  #tabs { display: flex; gap: 4px; height: 100%; }
  .nav-it {
    font-size: 14px; font-weight: 600; color: var(--sub); border: 0; background: none;
    padding: 0 14px; cursor: pointer; display: flex; align-items: center; gap: 7px; height: 58px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .nav-it:hover { color: var(--ink); }
  .nav-it.on { color: var(--blue); border-bottom-color: var(--blue); }
  .nav-it .cnt {
    font-size: 10.5px; font-weight: 700; color: #fff; background: var(--red);
    border-radius: 9px; padding: 0 6px; line-height: 16px;
  }
  .who { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--sub); }
  .who .org { display: flex; align-items: center; gap: 8px; }
  .who .avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--blue-bg); color: var(--blue);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
  }
  .who a { color: var(--sub); text-decoration: none; padding: 6px 10px; border: 1px solid var(--line2); border-radius: 6px; font-weight: 600; font-size: 12px; background: var(--panel); }
  .who a:hover { border-color: var(--faint); color: var(--ink); }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 22px 28px 48px; }

  /* ── 패널 ── */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .panel-hd { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
  .panel-hd .t { font-size: 14px; font-weight: 700; }
  .panel-hd .r { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--faint); }
  .panel-bd { padding: 16px 18px; }

  /* 지표: 한 패널 안 분할 */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; }
  .stats.panel { padding: 0; overflow: hidden; }
  .stat { padding: 15px 20px 13px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat b { display: block; font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span.l { display: block; font-size: 12px; color: var(--sub); margin-top: 3px; }
  .stat.bad b { color: var(--red); } .stat.warn b { color: var(--amber); } .stat.ok b { color: var(--green); }

  .view { animation: fade .2s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* 페이지 머리 */
  .pagehead { padding: 4px 2px 16px; display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .pagehead .tx { max-width: 84ch; }
  h2.q { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 3px; }
  .qsub { font-size: 12.5px; color: var(--sub); }
  .pagehead .actions { margin-left: auto; display: flex; gap: 8px; }
  .hint { font-size: 12.5px; color: var(--sub); margin-top: 12px; padding: 10px 14px; background: var(--blue-bg); border-radius: 6px; }

  /* ── 버튼 ── */
  button.act {
    font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 6px;
    border: 1px solid var(--blue); background: var(--blue); color: #fff; cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  button.act:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
  button.ghost2 { background: var(--panel); color: var(--ink); border-color: var(--line2); }
  button.ghost2:hover { background: var(--bg); border-color: var(--faint); }
  button.small { font-size: 12px; padding: 5px 11px; }
  button.danger { background: var(--panel); border-color: var(--line2); color: var(--red); }
  button.danger:hover { background: var(--red-bg); border-color: var(--red); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, .nav-it:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  textarea, select {
    font-family: var(--mono); font-size: 12px; line-height: 1.7; color: var(--ink);
    border: 1px solid var(--line2); border-radius: 6px; padding: 11px 13px; background: var(--panel);
  }
  textarea { width: 100%; resize: vertical; }
  textarea:focus, select:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: var(--blue); }
  select { font-family: var(--sans); font-size: 12.5px; padding: 6px 10px; }

  /* 상태 배지 */
  .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
  .badge.ok { color: var(--green); background: var(--green-bg); }
  .badge.warn { color: var(--amber); background: var(--amber-bg); }
  .badge.bad { color: var(--red); background: var(--red-bg); }
  .badge.gray { color: var(--sub); background: var(--bg); }

  /* ── 지도 ── */
  .mapgrid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
  svg.map { display: block; width: 100%; }
  svg.map text { font-family: var(--sans); }
  .zone { fill: #f8f9fb; stroke: var(--line2); stroke-width: 1; }
  .zone.core { fill: var(--blue-bg); stroke: var(--blue); stroke-width: 1.2; }
  .zone.rogue-z { fill: var(--red-bg); stroke: var(--red); }
  .zlabel { font-size: 10.5px; font-weight: 700; fill: var(--ink); }
  .zlabel.rogue { fill: var(--red); }
  .item { font-size: 10px; fill: var(--sub); }
  .conduit { stroke: #c4c8d0; stroke-width: 1.5; cursor: pointer; transition: stroke .12s ease, stroke-width .12s ease; }
  .conduit:hover, .conduit.sel { stroke: var(--blue); stroke-width: 2.4; }
  .conduit.rogue { stroke: var(--red); stroke-width: 1.7; stroke-dasharray: 5 4; }
  .cond-label { font-family: var(--mono); font-size: 8.5px; fill: var(--faint); cursor: pointer; }
  .cond-label:hover { fill: var(--blue); }
  .cond-label.rogue { fill: var(--red); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) {
    .conduit.rogue { animation: crawl 1.6s linear infinite; }
    @keyframes crawl { to { stroke-dashoffset: -18; } }
  }
  .maplegend { display: flex; gap: 24px; font-size: 12px; color: var(--sub); padding: 11px 18px; border-top: 1px solid var(--line); }
  .maplegend i { display: inline-block; width: 20px; height: 0; border-top: 1.5px solid #c4c8d0; vertical-align: 4px; margin-right: 7px; }
  .maplegend .r i { border-top: 1.7px dashed var(--red); }

  /* 우측 패널 목록 */
  .side { display: flex; flex-direction: column; gap: 16px; }
  .rowitem { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--sub); padding: 10px 18px; border-top: 1px solid var(--line); }
  .rowitem:first-of-type { border-top: none; }
  .rowitem b { color: var(--ink); font-weight: 600; }
  .rowitem .when { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--amber); white-space: nowrap; }
  .rowitem .host { font-family: var(--mono); font-size: 11.5px; color: var(--red); font-weight: 500; }
  .rowitem .sp { margin-left: auto; display: flex; gap: 5px; }
  .none { font-size: 12px; color: var(--faint); padding: 12px 18px; }

  /* 상세 */
  .detail { margin-top: 16px; display: none; }
  .detail .grid { display: grid; grid-template-columns: 110px 1fr; gap: 5px 18px; font-size: 12.5px; max-width: 780px; }
  .detail .grid dt { color: var(--faint); }
  .detail .grid dd { color: var(--ink); }
  .ai-note { margin-top: 12px; padding: 10px 14px; background: var(--red-bg); border-radius: 6px; font-size: 12px; line-height: 1.6; color: #912018; max-width: 752px; }
  .ai-note .lbl { font-weight: 700; color: var(--red); display: block; margin-bottom: 2px; }
  .content-log { margin-top: 12px; padding: 10px 14px; background: var(--green-bg); border-radius: 6px; font-size: 12px; color: #05603a; max-width: 752px; }

  /* ── 표 ── */
  table.ledger, table.res { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.ledger th, table.res th {
    background: #f9fafb; border-bottom: 1px solid var(--line);
    text-align: left; padding: 9px 14px; font-weight: 600; font-size: 11.5px; color: var(--sub);
  }
  table.ledger td, table.res td { border-bottom: 1px solid var(--line); padding: 11px 14px; vertical-align: top; }
  table.ledger tr:last-child td, table.res tr:last-child td { border-bottom: none; }
  table.ledger tbody tr:hover td { background: #fafbfc; }
  tr.row-rogue td { background: #fffafa; }
  tr.row-blocked { opacity: .5; }
  .aiwhy { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
  .mono { font-family: var(--mono); font-size: 11.5px; }
  td .nm { font-weight: 700; }
  td .idcode { font-family: var(--mono); font-size: 10px; color: var(--faint); display: block; margin-top: 1px; }
  .due-soon { color: var(--amber); font-weight: 700; }
  .cnt-has { color: var(--green); font-weight: 700; }

  /* ── 내용 검사 ── */
  .det-mode { display: flex; gap: 14px; align-items: center; font-size: 12px; flex-wrap: wrap; color: var(--sub); }
  .det-mode label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .det-mode input { accent-color: var(--blue); }
  .det-mode .ok-dot { font-size: 11px; color: var(--green); font-weight: 600; }
  .det-mode .off-dot { font-size: 11px; color: var(--faint); }
  .det-hit { display: flex; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 12.5px; align-items: baseline; }
  .det-hit:last-of-type { border-bottom: none; }
  .det-hit .tag { font-family: var(--mono); font-size: 9.5px; white-space: nowrap; font-weight: 600; }
  .det-hit.viol .tag { color: var(--red); } .det-hit.warn .tag { color: var(--amber); } .det-hit.info .tag { color: var(--faint); }
  .det-hit .span { font-family: var(--mono); font-size: 11.5px; background: var(--bg); border-radius: 4px; padding: 1px 7px; }
  .det-hit .note { font-size: 11.5px; color: var(--sub); }
  .det-empty { color: var(--faint); font-size: 12px; padding: 11px 18px; }

  /* ── 모달 ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(16,24,40,.45);
    display: none; align-items: flex-start; justify-content: center;
    padding: 48px 16px; overflow-y: auto; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    max-width: 700px; width: 100%; padding: 24px 28px;
    box-shadow: 0 12px 32px rgba(16,24,40,.16);
    animation: fade .18s ease both;
  }
  .modal h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 2px; }
  .modal .wsub { font-size: 11.5px; color: var(--faint); margin-bottom: 16px; }
  .modal .wsub a { color: var(--sub); }
  .wsteps { display: flex; gap: 5px; margin-bottom: 18px; }
  .wsteps .s { flex: 1; font-size: 10px; color: var(--faint); border-bottom: 2px solid var(--line); padding-bottom: 6px; }
  .wsteps .s.on { color: var(--blue); border-color: var(--blue); font-weight: 700; }
  .opt { display: flex; gap: 12px; align-items: baseline; padding: 12px 10px; border: 1px solid transparent; border-bottom: 1px solid var(--line); cursor: pointer; }
  .opt:hover { background: var(--bg); }
  .opt.sel { background: var(--blue-bg); border-radius: 6px; border-bottom-color: transparent; }
  .opt .mark { flex: 0 0 13px; height: 13px; border: 1.5px solid var(--faint); border-radius: 50%; position: relative; top: 2px; background: var(--panel); }
  .opt.sel .mark { border-color: var(--blue); }
  .opt.sel .mark::after { content: ""; position: absolute; inset: 2.5px; background: var(--blue); border-radius: 50%; }
  .opt .t { font-weight: 700; font-size: 13px; }
  .opt.sel .t { color: var(--blue-dark); }
  .opt .d { font-size: 11.5px; color: var(--sub); margin-top: 1px; }
  .evi { border-top: 1px solid var(--line); padding: 13px 2px 11px; }
  .evi .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .evi .feat { font-weight: 700; font-size: 12.5px; }
  .avtag { font-size: 10.5px; font-weight: 600; }
  .avtag.builtin { color: var(--green); } .avtag.higher_tier { color: var(--amber); }
  .avtag.third_party { color: var(--sub); } .avtag.none { color: var(--red); } .avtag.unclear { color: var(--faint); }
  .evi .ctrl { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .applychk { display: flex; gap: 8px; align-items: flex-start; margin-top: 9px; font-size: 12px; cursor: pointer; }
  .applychk input { margin-top: 3px; accent-color: var(--blue); }
  .wnav { display: flex; justify-content: space-between; margin-top: 20px; }
  .verdict-line { border-top: 1px solid var(--line); padding-top: 15px; margin-top: 6px; }
  .verdict-line .word { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .verdict-line.ok .word { color: var(--green); } .verdict-line.cond .word { color: var(--amber); } .verdict-line.bad .word { color: var(--red); }
  .finding { display: flex; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .finding .ic { font-family: var(--mono); font-weight: 600; }
  .finding.r .ic { color: var(--red); } .finding.w .ic { color: var(--amber); } .finding.g .ic { color: var(--green); }

  /* ── 반기 보고 ── */
  .report-page { padding: 30px 34px; max-width: 840px; color: #1c1e22; }
  .report-page h3 { border-bottom: 2px solid #1c1e22; padding-bottom: 6px; font-size: 16px; margin-bottom: 6px; }
  .report-page h4 { margin: 18px 0 6px; font-size: 13.5px; }
  .report-page p { font-size: 12px; }
  .report-page table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
  .report-page th { background: #f4f4f1; border: 1px solid #bbb; padding: 5px 8px; text-align: left; }
  .report-page td { border: 1px solid #bbb; padding: 5px 8px; }
  .report-page tr.flag td { background: var(--red-bg); }

  footer.legal { max-width: 1320px; margin: 0 auto; padding: 0 28px 40px; font-size: 10.5px; color: var(--faint); line-height: 1.8; }

  @media (max-width: 980px) {
    header.appbar .in { padding: 0 16px; gap: 16px; height: auto; flex-wrap: wrap; padding-top: 10px; }
    .nav-it { height: 44px; padding: 0 10px; }
    .who { display: none; }
    .wrap { padding: 16px 16px 40px; }
    .mapgrid { grid-template-columns: 1fr; }
    footer.legal { padding: 0 16px 32px; }
  }
  @media print {
    body * { visibility: hidden; }
    .report-page, .report-page * { visibility: visible; }
    .report-page { position: absolute; left: 0; top: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .view, .modal { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

<div class="wrap">

    로그 목적지 분류와 위반 사유 문장, 결합 판단은 실서비스에서 로컬 소형 LLM(Kanana)이 담당한다.
    데모 일부는 내장 근사다. 본 도구는 법적 판단을 대행하지 않는다. 근거: 전자금융감독규정 시행세칙 제2조의3.

const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mask(s){
  return String(s)
    .replace(/\d[\d\s-]{4,}\d/g, run => {
      const total = (run.match(/\d/g)||[]).length; if (total < 5) return run;
      let seen = 0;
      return run.split('').reverse().map(ch => !/\d/.test(ch) ? ch : (++seen <= 4 ? ch : '*')).reverse().join('');
    })
    .replace(/([가-힣])[가-힣]([가-힣]?)(\s?(고객님|고객|님|씨))/g, '$1*$2$3');
}
function saasEntriesFor(key){
  if (!key) return [];
  const pack = (window.SALPI_EVIDENCE||[]).find(e => e.saas.toLowerCase().includes(key === 'm365' ? 'microsoft' : key));
  return pack ? pack.entries.map((e,i)=>({ ...e, _i:i })) : [];
}
function contentCount(id){ return (state.contentLog[id]||[]).length; }

/* ═══════════════ 로그 대조 (결정적) ═══════════════ */
function parseLog(text){
  const agg = {};
  for (const line of text.split('\n')) {
    const h = /HOST=(\S+)/.exec(line), s = /SRC=(\S+)/.exec(line), p = /DPT=(\S+)/.exec(line);
    if (!h) continue;
    const host = h[1].toLowerCase();
    agg[host] = agg[host] || { count:0, srcs:new Set(), ports:new Set() };
    agg[host].count++; if (s) agg[host].srcs.add(s[1]); if (p) agg[host].ports.add(p[1]);
  }
  return agg;
}
const matchLedger = host => LEDGER.find(c => c.domains.some(d => host === d || host.endsWith('.'+d)));
const isBlocked  = host => state.blocked.find(b => b.host === host);
function reconcile(text){
  const agg = parseLog(text);
  const rows = [], rogues = [];
  for (const [host, info] of Object.entries(agg)) {
    const hit = matchLedger(host);
    if (hit) { rows.push({ host, info, status:'ok', conduit:hit }); continue; }
    const blk = isBlocked(host);
    if (blk) { rows.push({ host, info, status:'blocked', blk }); continue; }
    const base = Object.keys(CLASSIFY).find(k => host === k || host.endsWith('.'+k));
    const cls = base ? CLASSIFY[base] : { kind:'미분류', saasLike:false, risk:'승인 대장의 어느 통로에도 해당하지 않는 외부 연결' };
    const rogue = { host, info, cls };
    rows.push({ host, info, status:'rogue', rogue });
    rogues.push(rogue);
  }
  rows.sort((a,b) => (a.status==='rogue'?-1:1) - (b.status==='rogue'?-1:1) || b.info.count - a.info.count);
  return { rows, rogues };
}

function wizJudge(w){
  const risks = [], oks = [];
  if (w.nature === 'intent')
    return { grade:'bad', title:'예외 적용 불가', risks:[{lv:'r', t:'고객 정보를 다루는 것이 업무 목적 자체. 제1항 3호의 "처리하지 않는 이용 목적"에 해당하지 않음. 혁신금융서비스 경로 또는 차단.'}], oks };
  if (w.l1 === 'yes')
    return { grade:'bad', title:'예외 적용 불가', risks:[{lv:'r', t:'고객정보 필드형 기능 사용 계획. 구조화된 저장과 검색으로서 명백한 처리.'}], oks };
  const risky = ['combined','unique'].includes(w.nature);
  if (w.nature === 'unique') risks.push({lv:'w', t:'고유식별정보 유입 가능성. 입력 차단 통제 필수.'});
  const ctrl = w.entries.filter(e => (e.layer==='L2'||e.layer==='L3') && e.exists!=='no');
  if (!ctrl.length) {
    // 근거 미수집 SaaS. 실서비스는 E 파이프라인(LLM 문서 추출)이 수집
    if (risky) risks.push({lv:'r', t:'통제 근거 미수집 상태에서 고객 정보 유입 가능 용도. 등재 불가. 근거 수집(E 파이프라인) 후 재판정하거나 차단.'});
    else risks.push({lv:'w', t:'통제 근거 미수집. 조건부 등재하고 벤더 문서 근거 수집을 등재 조건으로 부기.'});
  }
  for (const e of ctrl) {
    const has = ['builtin','higher_tier','third_party'].includes(e.control_availability);
    const applied = w.applied[e._i], comp = w.comp[e._i];
    if (has && applied) oks.push({lv:'g', t:`${e.feature}: 적용 계획 확인`});
    else if (!has && comp) risks.push({lv:'w', t:`${e.feature}: 벤더 미제공. 살피 내용검사를 보완통제로 지정`});
    else if (risky) risks.push({lv:'r', t:`${e.feature}: 통제 미적용. 유입 가능 용도에서 접점 열림`});
    else risks.push({lv:'w', t:`${e.feature}: 통제 미적용 (권고)`});
  }
  const hard = risks.filter(r => r.lv==='r').length;
  if (hard) return { grade:'bad', title:'조건 미충족, 등재 불가', risks, oks };
  if (risks.length) return { grade:'cond', title:'조건부 적합, 등재 가능', risks, oks };
  return { grade:'ok', title:'예외 요건 충족, 등재 가능', risks, oks };
}

  if (w.step === 4) {
    const ctrl = w.entries.filter(e => (e.layer==='L2'||e.layer==='L3') && e.exists!=='no');
    body = ctrl.length ? ctrl.map(e => {
      const has = ['builtin','higher_tier','third_party'].includes(e.control_availability);
      const AV = {builtin:'[기본 제공]',higher_tier:'[상위 요금제]',third_party:'[서드파티]',none:'[미제공]',unclear:'[미확인]'};
      return `<div class="evi"><div class="head"><span class="feat">${esc(e.feature)}</span><span class="avtag ${e.control_availability}">${AV[e.control_availability]}</span></div>
        <div class="ctrl">${esc(e.control.slice(0,140))}${e.control.length>140?'…':''}</div>

        <span>${has?'이 통제를 적용한다':'벤더 미제공. <b>살피 내용검사를 보완통제로 지정</b>한다'}</span></label></div>`;
    }).join('') + nav(true, '판정')

let detSeq = 0;
function renderContent(){
  const saas = LEDGER.filter(c => c.zone==='saas');
  $('#main').innerHTML = `<section class="view">
    <div class="pagehead">
      <div class="tx">

        탐지 기록은 마스킹되어 해당 통로의 반기 자체평가 증적으로 저장됩니다.</p>
      </div>
    </div>
    <div class="panel"><div class="panel-hd">
      <span style="font-size:12.5px;color:var(--sub)">대상 SaaS</span>
      <select id="det-target">
        ${saas.map(c=>`<option value="${c.id}">${c.id} ${esc(c.name)}</option>`).join('')}
      </select>
      <span class="det-mode" id="det-mode"></span>
      <span class="r"><button class="act ghost2 small" id="det-sample">예시 회의록 넣기</button></span>
    </div><div class="panel-bd">

    <div id="det-out" class="det-out panel" style="display:none;margin-top:14px"></div>
    <div id="det-note"></div></section>`;
  $('#det-sample').onclick = () => {
    $('#det-in').value = `3월 여신협의회 회의록\n1. 박지현 고객 주택담보대출 연체 3개월 경과 건. 연락처 010-4821-7733.\n2. 신규 상품 한도 정책은 다음 회의에서 확정.\n3. 정해나 고객 재방문 상담 진행.\n   - 해당 고객은 신용대출 상환 지연 이력이 있음.\n4. 사내 워크숍 일정 공유.`;
    detRun();
  };
  $('#det-in').oninput = () => { clearTimeout(window._dt); window._dt = setTimeout(detRun, 500); };
  detProbe();
}
async function detProbe(){
  const el = $('#det-mode'); if (!el) return;
  const av = await SalpiEngine.llmAvailable();
  state.detReady = !!(av.ok && av.hasModel);
  el.innerHTML = state.detReady
    ? `<label><input type="radio" name="dm" value="heuristic" ${state.detMode==='heuristic'?'checked':''}> 빠른 검사</label>
       <label><input type="radio" name="dm" value="hybrid" ${state.detMode==='hybrid'?'checked':''}> 정밀 검사 (로컬 AI)</label><span class="ok-dot">모델 연결됨</span>`
    : `<span class="off-dot">로컬 모델 미연결, 빠른 검사로 동작</span>`;
  el.querySelectorAll('input[name="dm"]').forEach(r => r.onchange = () => { state.detMode = r.value; detRun(); });
}
async function detRun(){
  const ta = $('#det-in'), out = $('#det-out'), note = $('#det-note');
  if (!ta || !out) return;
  if (!ta.value.trim()) { out.innerHTML = ''; out.style.display = 'none'; note.innerHTML = ''; return; }
  const seq = ++detSeq;
  out.style.display = 'block';
  if (state.detMode !== 'heuristic') out.innerHTML = '<div class="det-empty">정밀 검사 중…</div>';
  const res = await SalpiEngine.scan(ta.value, { mode: state.detMode });
  if (seq !== detSeq) return;
  const target = $('#det-target')?.value || 'C-05';
  const viols = res.hits.filter(h => h.severity==='violation');
  if (viols.length) {
    state.contentLog[target] = (state.contentLog[target]||[]).concat(
      viols.map(v => ({ t: Date.now(), tag: v.tag, masked: mask(v.span).slice(0,60) }))).slice(-100);
    renderStrip();
  }
  out.innerHTML = (res.degraded?`<div class="det-empty" style="color:var(--amber)">${esc(res.degraded)}</div>`:'') +
    (res.hits.length ? res.hits.map(h => {
      const lv = h.severity==='violation'?'viol':(h.label==='identifier_only'?'info':'warn');
      return `<div class="det-hit ${lv}"><span class="tag">[${esc(h.tag)}]</span><span class="span">${esc(h.span.slice(0,64))}</span><span class="note">${esc(h.note)}</span></div>`;
    }).join('') : '<div class="det-empty">탐지된 항목 없음</div>');
  note.innerHTML = viols.length ? `<div class="hint">위반 ${viols.length}건이 ${target} 내용검사 기록으로 저장되었습니다(마스킹). 대장과 반기 보고에 반영됩니다.</div>` : '';
}

    <div class="pagehead">
      <div class="tx">
        <h2 class="q">반기 보고</h2>
        <p class="qsub">정보보호위원회 제출용 초안입니다. 운영 현황, 자체평가, 내용검사 증적이 자동으로 채워집니다.</p>
      </div>
      <div class="actions"><button class="act" onclick="window.print()">인쇄 / PDF 저장</button></div>
    </div>
    <div class="panel report-page">
      <h3>망분리 적용 예외 운영 현황 및 반기 자체평가 보고 (초안)</h3>
      <p style="color:#555">기준일 ${now.toISOString().slice(0,10)}, 근거: 시행세칙 제2조의3 제3항과 제4항</p>
      <h4>1. 예외 운영 현황</h4>
      <table><tr><th>유형</th><th>건수</th></tr>
        ${Object.entries(byType).map(([t,n])=>`<tr><td>${t}</td><td>${n}</td></tr>`).join('')}
        <tr ${state.rogues.length?'class="flag"':''}><td><b>미등록 연결 (로그 실측)</b></td><td><b>${state.rogues.length}</b></td></tr>
        ${state.blocked.length?`<tr><td>차단 확정</td><td>${state.blocked.length}</td></tr>`:''}
      </table>
      <h4>2. SaaS 반기 자체평가 (제4항)와 내용검사 증적</h4>
      <table><tr><th>통로</th><th>적용 통제</th><th>내용검사 기록</th><th>기한</th></tr>
        ${saas.map(c=>`<tr><td>${c.id} ${esc(c.name)}</td><td style="font-size:11px">${esc(c.controls)}</td>
          <td>${contentCount(c.id)}건 (마스킹 저장)</td><td>${c.review.due}</td></tr>`).join('')}
      </table>
      <h4>3. 미등록 연결 발견과 조치</h4>
      ${state.rogues.length || state.blocked.length ? `<table><tr><th>목적지</th><th>분류</th><th>상태</th></tr>
        ${state.rogues.map(r=>`<tr><td>${esc(r.host)}</td><td>${r.cls.kind}</td><td>조치 대기 (등재 판정 또는 차단)</td></tr>`).join('')}
        ${state.blocked.map(b=>`<tr><td>${esc(b.host)}</td><td>${b.kind}</td><td>차단 확정</td></tr>`).join('')}</table>`
        : '<p>로그 대조를 먼저 실행하면 이 절이 채워진다.</p>'}
      <table style="margin-top:16px"><tr><th style="width:70%">확인</th><th>서명</th></tr>
        <tr><td>작성: 정보보호 담당</td><td></td></tr><tr><td>정보보호최고책임자(CISO)</td><td></td></tr></table>
      <p style="font-size:10.5px;color:#777;margin-top:12px">본 문서는 살피가 생성한 초안이며 위원회 심의와 확정 전 검토용이다.</p>
    </div></section>`;
}

function render(){
  renderStrip(); renderTabs();
  ({ map:renderMap, ledger:renderLedger, logs:renderLogs, content:renderContent, report:renderReport })[state.tab]();
}
render();
</script>
</body>
</html>
