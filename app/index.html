<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>살피 SALPI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      /* 추론 서버 주소 결정. 주소의 llm 파라미터 > 배포본의 llm-endpoint.txt > localhost Ollama.
         적힌 터널 주소가 죽어 있으면 무시하고 localhost로 남긴다 */
      (function(){
        var v = new URLSearchParams(location.search).get('llm');
        if (v) { window.SALPI_LLM_ENDPOINT = v; return; }
        if (location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname)) return;
        fetch('/llm-endpoint.txt').then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
          t = (t || '').trim();
          if (!t.startsWith('https://')) return;
          var ctl = new AbortController(); setTimeout(function(){ ctl.abort(); }, 4000);
          return fetch(t + '/api/tags', { signal: ctl.signal }).then(function(r){ if (r.ok) window.SALPI_LLM_ENDPOINT = t; }).catch(function(){});
        }).catch(function(){});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
